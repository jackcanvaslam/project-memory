:root {
  --ink: #2a1f5c; --ink-soft: #6a5fa0;
  --purple: #7a5cf0; --purple-d: #5233c4;
  --yellow: #ffd23f; --yellow-d: #dc9a00;
  --green: #3fd17f; --green-d: #1c9955;
  --pink: #ff6fa8; --pink-d: #d13a79;
  --blue: #4db8ff; --blue-d: #1c82d2;
  --orange: #ff9f43; --orange-d: #d86f10;
  --grey: #c9cde0; --grey-d: #9298b5;
  --ui: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --type: 'Atkinson', 'Verdana', 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #171334; }
body { font-family: var(--ui); color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }

#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #3fa9f5; border-radius: 0; }
#bg, #fx { position: absolute; left: 0; top: 0; display: block; }
#fx { pointer-events: none; z-index: 50; }
#screens { position: absolute; inset: 0; z-index: 2; }
.screen { position: absolute; inset: 0; animation: scr-in .32s cubic-bezier(.2, .9, .3, 1.1) both; }
.screen.leaving { animation: scr-out .24s ease-in both; pointer-events: none; }
@keyframes scr-in { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
@keyframes scr-out { to { opacity: 0; transform: scale(.98); } }

/* ---------- buttons, pills, panels ---------- */
.btn { --c: var(--purple); --cd: var(--purple-d); display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 12px 26px; border-radius: 20px; font-weight: 600; font-size: 24px; color: #fff; background: var(--c);
  box-shadow: 0 6px 0 var(--cd), 0 12px 20px rgba(30, 20, 80, .25); transition: transform .08s, box-shadow .08s, filter .15s; white-space: nowrap; }
.btn:hover { filter: brightness(1.07); transform: translateY(-2px); box-shadow: 0 8px 0 var(--cd), 0 14px 22px rgba(30, 20, 80, .28); }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--cd), 0 3px 6px rgba(30, 20, 80, .25); }
.btn.green { --c: var(--green); --cd: var(--green-d); } .btn.yellow { --c: var(--yellow); --cd: var(--yellow-d); color: #5a3d00; }
.btn.pink { --c: var(--pink); --cd: var(--pink-d); } .btn.blue { --c: var(--blue); --cd: var(--blue-d); }
.btn.orange { --c: var(--orange); --cd: var(--orange-d); } .btn.white { --c: #fff; --cd: #cfd3ea; color: var(--ink); }
.btn.grey { --c: var(--grey); --cd: var(--grey-d); color: #5b6185; }
.btn.big { font-size: 34px; padding: 16px 44px; border-radius: 26px; }
.btn.small { font-size: 18px; padding: 8px 16px; border-radius: 14px; box-shadow: 0 4px 0 var(--cd), 0 6px 12px rgba(30, 20, 80, .2); }

/* ---------- pop-up cards ---------- */

  box-shadow: 0 10px 0 rgba(40, 25, 110, .25), 0 30px 70px rgba(10, 5, 50, .5); animation: pop .38s cubic-bezier(.2, 1.3, .4, 1) both; }

  opacity: 0; transition: transform .3s cubic-bezier(.2, 1.4, .4, 1), opacity .25s; pointer-events: none; white-space: nowrap; box-shadow: 0 10px 24px rgba(0, 0, 0, .3); }

/* ---------- the dragon and friends ---------- */
.dragon, .friend, .egg, .item { display: block; overflow: visible; }
.dr-mouth-open, .dr-eye-happy { display: none; }
.happy .dr-mouth-open, .happy .dr-eye-happy, .mouth-open .dr-mouth-open { display: block; }
.happy .dr-mouth-closed, .happy .dr-eye-open, .mouth-open .dr-mouth-closed { display: none; }
.dr-wing { animation: dr-flap 2.6s ease-in-out infinite; }
.dr-wing-far { animation-delay: -.2s; }
@keyframes dr-flap { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(11deg) scaleY(.94); } }
.dr-tail { animation: dr-tail 2.2s ease-in-out infinite; }
@keyframes dr-tail { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(8deg); } }
.dr-head { animation: dr-head 3.4s ease-in-out infinite; }
@keyframes dr-head { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
.dr-all { animation: dr-bob 2.6s ease-in-out infinite; }

.happy .dr-head { animation: dr-nod .34s ease-in-out infinite; }
@keyframes dr-nod { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(4deg); } }
.fly .dr-shadow { display: none; }

.fly .dr-wing-far { animation-delay: -.05s; }
@keyframes dr-flap-fast { 0%, 100% { transform: rotate(-32deg) scaleY(1.05); } 50% { transform: rotate(36deg) scaleY(.6); } }
.fly .dr-tail { animation-duration: .8s; }
.fly .dr-arm { transform: rotate(-30deg); }
.eating .dr-mouth-closed { animation: chew .32s steps(1) 4; } .eating .dr-mouth-open { display: block; animation: chew2 .32s steps(1) 4; }
@keyframes chew { 0% { opacity: 0; } 50% { opacity: 1; } } @keyframes chew2 { 0% { opacity: 1; } 50% { opacity: 0; } }
.hop { animation: hop .55s cubic-bezier(.3, .7, .4, 1); }
@keyframes hop { 0% { transform: none; } 20% { transform: scale(1.06, .9); } 50% { transform: translateY(-46px) scale(.96, 1.06); } 80% { transform: scale(1.05, .93); } 100% { transform: none; } }
.fr-all { animation: dr-bob 2.2s ease-in-out infinite; }
.friend:nth-child(2n) .fr-all { animation-delay: -.8s; }
.fr-tail { animation: dr-tail 1.6s ease-in-out infinite; }

@keyframes ear { 0%, 84%, 100% { transform: rotate(0); } 88% { transform: rotate(-9deg); } 94% { transform: rotate(6deg); } }
.fr-head { animation: dr-head 4s ease-in-out infinite; }

.egg .crack { display: none; }
.egg.k1 .c1, .egg.k2 .c1, .egg.k2 .c2, .egg.k3 .c1, .egg.k3 .c2, .egg.k3 .c3, .egg.k4 .crack { display: block; }

@keyframes egg-wob { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-5deg); } 86% { transform: rotate(5deg); } 93% { transform: rotate(-2deg); } }
.egg.shake .egg-shell { animation: egg-shake .32s; }
@keyframes egg-shake { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-9deg) scale(1.04); } 60% { transform: rotate(8deg) scale(1.04); } }

/* ---------- title ---------- */

  animation: logo-bob 2.2s ease-in-out infinite; animation-delay: calc(var(--i) * -.16s); text-shadow: 0 3px 0 rgba(0, 0, 0, .14); }

/* ---------- first run: hatching ---------- */
.scr-hatch { display: flex; flex-direction: column; align-items: center; }
.coach { margin-top: 26px; padding: 18px 34px; max-width: 980px; text-align: center; font-size: 27px; font-weight: 600; line-height: 1.25; }
.coach b { color: var(--purple-d); }
.keycap { display: inline-grid; place-items: center; min-width: 44px; height: 44px; padding: 0 10px; margin: 0 3px; border-radius: 12px; background: var(--kc, var(--purple)); color: #fff; font-weight: 700; font-size: 26px; box-shadow: 0 5px 0 rgba(0, 0, 0, .22); vertical-align: middle; }
.hatch-egg { position: absolute; left: 50%; top: 178px; width: 210px; margin-left: -105px; }

.hatch-card h2 { margin: 0; font-size: 34px; }
.kb-dock { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 12px 16px 10px; display: flex; gap: 10px; align-items: flex-end; }

/* ---------- keyboard ---------- */
.kb { width: 826px; display: flex; flex-direction: column; gap: 5px; }
.kb-row { display: flex; gap: 5px; height: 50px; }
.kb-row.num { height: 32px; } .kb-row.sp { height: 42px; justify-content: center; }
.key { --kc: #cfd3e6; flex: none; width: 50px; border-radius: 11px; background: color-mix(in srgb, var(--kc) 34%, #fff); color: #4a4470; font-weight: 600; font-size: 23px; display: grid; place-items: center; position: relative;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--kc) 70%, #57508a); transition: transform .06s, background .12s, box-shadow .06s; text-transform: uppercase; }
.key.wide { flex: 1 1 auto; font-size: 14px; text-transform: lowercase; color: #7a7499; }

.key.bump::after { content: ''; position: absolute; bottom: 7px; left: 50%; width: 14px; height: 3px; margin-left: -7px; border-radius: 2px; background: currentColor; opacity: .55; }
.key.off { --kc: #d8dbe8 !important; background: #eceef6; color: #b9bdd2; box-shadow: 0 4px 0 #c6cade; }
.key.target { background: var(--kc); color: #fff; transform: translateY(-4px) scale(1.12); z-index: 2; text-shadow: 0 2px 0 rgba(0, 0, 0, .18);
  box-shadow: 0 8px 0 color-mix(in srgb, var(--kc) 62%, #2a1f5c), 0 0 0 5px #fff, 0 0 26px 8px var(--kc); animation: key-glow 1s ease-in-out infinite; }
@keyframes key-glow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }
.key.target.wide, .key.target[data-k=" "] { transform: translateY(-3px) scale(1.04); box-shadow: 0 7px 0 color-mix(in srgb, var(--kc) 62%, #2a1f5c), 0 0 0 5px #fff, 0 0 16px 4px var(--kc); }
.key.down { transform: translateY(4px) !important; box-shadow: 0 0 0 transparent !important; }
.key.ok { background: var(--green) !important; color: #fff; } .key.bad { background: #ff5a6e !important; color: #fff; animation: shake .25s; }

.hand-box { width: 172px; display: flex; flex-direction: column; align-items: center; gap: 4px; }

.finger-hint { height: 30px; padding: 0 14px; border-radius: 15px; font-size: 18px; font-weight: 600; color: #fff; background: var(--fc, transparent); display: grid; place-items: center; white-space: nowrap; opacity: 0; transition: opacity .15s; }

.fr-bunny { left: 372px; top: 440px; } .fr-fox { left: 790px; top: 434px; } .fr-kitten { left: 196px; top: 452px; } .fr-panda { left: 966px; top: 398px; }

.map-lock { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); padding: 26px 44px; text-align: center; z-index: 4; }

/* Dragon Keys - builds the lines of text for each level */
'use strict';

const Content = (() => {
  const MAXLINE = 28;
  const rnd = n => Math.floor(Math.random() * n);
  const pick = arr => arr[rnd(arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const isLetter = ch => /[a-z]/.test(ch);

  const levelIndex = id => LEVELS.findIndex(l => l.id === id);

  /* Every key learned up to and including level index i */
  function keysUpTo(i) {
    let keys = '';
    for (let k = 0; k <= i && k < LEVELS.length; k++) keys += LEVELS[k].keys;
    if (i >= levelIndex('4-1')) keys += 'SHIFT';
    return keys;
  }
  function lettersUpTo(i) {
    return keysUpTo(Math.min(i, levelIndex('3-6'))).replace(/[^a-z]/g, '');
  }
  function wordPool(letters, minLen = 1, maxLen = 9) {
    const ok = new Set(letters);
    return WORD_SET.filter(w => w.length >= minLen && w.length <= maxLen && [...w].every(c => ok.has(c)));
  }

  function wrap(text, max = MAXLINE) {
    const out = []; let line = '';
    for (const w of text.split(' ')) {
      if (line && (line + ' ' + w).length > max) { out.push(line); line = w; }
      else line = line ? line + ' ' + w : w;
    }
    if (line) out.push(line);
    return out;
  }

  /* Pick words, favouring ones with the new keys and the keys she misses most */
  function weightedWords(pool, count, favour, weak) {
    const fav = new Set(favour);
    const scored = pool.map(w => {
      let s = 1;
      if ([...w].some(c => fav.has(c))) s += 3;
      for (const c of w) s += (weak[c] || 0) * 2;
      return { w, s };
    });
    const out = [];
    let guard = 0;
    while (out.length < count && guard++ < count * 30) {
      const total = scored.reduce((t, x) => t + x.s, 0);
      let r = Math.random() * total, chosen = scored[0];
      for (const x of scored) { r -= x.s; if (r <= 0) { chosen = x; break; } }
      if (out.length && out[out.length - 1] === chosen.w) continue;
      if (out.includes(chosen.w) && scored.length > count) continue;
      if (out.filter(x => x === chosen.w).length >= 2 && scored.length > 6) continue;
      out.push(chosen.w);
    }
    return out;
  }

  function wordLines(words, lineCount, joiner = ' ', max = 25) {
    const lines = []; let line = '';
    for (const w of words) {
      if (lines.length >= lineCount) break;
      const next = line ? line + joiner + w : w;
      if (next.length > max) { lines.push(line); line = w; } else line = next;
    }
    if (line && lines.length < lineCount) lines.push(line);
    return lines;
  }

  function mixedGroups(newKeys, oldLetters, groups) {
    const letters = [...newKeys].filter(isLetter);
    const punct = [...newKeys].filter(c => !isLetter(c));
    const anchors = oldLetters.length ? [...oldLetters] : letters;
    const out = [];
    for (let g = 0; g < groups; g++) {
      const len = 2 + rnd(2);
      let s = '';
      const mustAt = rnd(len);
      for (let i = 0; i < len; i++) {
        let c = (i === mustAt || Math.random() < 0.35) ? pick(letters.length ? letters : anchors) : pick(anchors);
        if (s.length >= 2 && s[s.length - 1] === c && s[s.length - 2] === c) c = pick(anchors);
        s += c;
      }
      if (punct.length && Math.random() < 0.6) s += pick(punct);
      out.push(s);
    }
    return out.join(' ');
  }

  function decorate(words, p) {
    if (p === ';') return words.map(w => Math.random() < 0.5 ? w + ';' : w);
    if (p === ',') return words.map((w, i) => (i % 4 !== 3) ? w + ',' : w);
    if (p === '.') return words.map((w, i) => (i % 2 === 1) ? w + '.' : w);
    return words;
  }

  function keysLevel(level, idx, weak) {
    const [a, b] = [...level.keys];
    const old = lettersUpTo(idx - 1);
    const all = lettersUpTo(idx);
    const punct = [...level.keys].find(c => !isLetter(c));
    const lines = [
      `${a}${a}${a} ${b}${b}${b} ${a}${a} ${b}${b} ${a}${b}`,
      `${a}${b}${a} ${a}${a}${b} ${b}${a} ${a}${b}${b} ${a}${b}`,
    ];
    if (punct) lines[1] = `${a}${b} ${a}${a}${b} ${a}${b} f${b} j${b} ${a}${b}`;
    const newLetters = [...level.keys].filter(isLetter);
    const pool = wordPool(all, 2, level.world === 1 ? 6 : 7);
    const withNew = pool.filter(w => newLetters.some(c => w.includes(c)));
    lines.push(mixedGroups(level.keys, old, 5));
    if (withNew.length >= 8) {
      const count = level.world === 1 ? 3 : 4;
      let words = shuffle(weightedWords(withNew, 20, newLetters, weak).concat(weightedWords(pool, 10, [], weak)));
      words = words.filter((w, i) => i === 0 || w !== words[i - 1]);
      if (punct) words = decorate(words, punct);
      lines.push(...wordLines(words, count));
    } else {
      lines.push(mixedGroups(level.keys, old, 5));
      lines.push(mixedGroups(level.keys, old, 5));
    }
    if (level.extra) lines.push(...level.extra);
    return lines;
  }

  function reviewLevel(level, idx, weak) {
    const all = lettersUpTo(idx);
    const worldKeys = LEVELS.filter(l => l.world === level.world).map(l => l.keys).join('').replace(/[^a-z]/g, '');
    const pool = wordPool(all, 2, 7);
    let words = weightedWords(pool, 60, worldKeys, weak);
    if (level.world === 1) words = words.map(w => Math.random() < 0.2 ? w + ';' : w);
    const lines = wordLines(words, 7);
    if (level.world === 3) lines.splice(4, 3, 'a fox, a cat, and a zebra.', 'mix six eggs in a bowl.', 'the wizard can zap a box.');
    return lines;
  }

  function commonLevel() {
    return wordLines(shuffle(COMMON_WORDS), 8, ' ', 27);
  }

  function authoredLevel(level, names) {
    let src = level.lines.slice();
    if (level.pick) src = shuffle(src).slice(0, level.pick);
    const out = [];
    for (let s of src) {
      s = s.replace(/\{P\}/g, names.pet).replace(/\{K\}/g, names.kid);
      out.push(...wrap(s));
    }
    return out;
  }

  /* weak: map of key -> 0..1 "how often she misses it" ; names: {pet, kid} */
  function build(levelId, weak = {}, names = { pet: 'Ember', kid: 'Sam' }) {
    const idx = levelIndex(levelId);
    const level = LEVELS[idx];
    let lines;
    if (level.kind === 'keys') lines = keysLevel(level, idx, weak);
    else if (level.kind === 'review') lines = reviewLevel(level, idx, weak);
    else if (level.kind === 'common') lines = commonLevel();
    else lines = authoredLevel(level, names);
    return lines.map(l => l.trim()).filter(Boolean);
  }

  /* Words for the mini-game: anything she can already type */
  function miniWords(highestIdx) {
    const pool = wordPool(lettersUpTo(highestIdx), 2, 7);
    return pool.length >= 12 ? pool : wordPool('asdfghjkl', 2, 6);
  }

  return { build, keysUpTo, lettersUpTo, levelIndex, wordPool, miniWords, wrap, shuffle, pick, rnd };
})();

/* ---- state.js ---- */
/* Dragon Keys - saved progress (kept in this browser only) */
'use strict';

const Store = (() => {
  const KEY = 'dragon-keys-save-v1';
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);

  const fresh = () => ({
    v: 1, kid: '', hatched: false,
    pet: { name: '', color: 'emerald', wear: [], hearts: 3, lastCare: today() },
    coins: 0, levels: {}, owned: {}, food: {}, friends: [], seenStage: 0,
    keys: {}, history: [], streak: { count: 0, last: '' }, totalSecs: 0,
    settings: { sound: true, unlockAll: false }, mini: { best: 0, plays: 0 },
  });

  let S = fresh();
  let memoryOnly = false;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) S = Object.assign(fresh(), JSON.parse(raw));
      S.pet = Object.assign(fresh().pet, S.pet);
      S.settings = Object.assign(fresh().settings, S.settings);
      S.mini = Object.assign(fresh().mini, S.mini);
    } catch (e) { memoryOnly = true; }
    // Hearts drift down one per day away, never below 1
    const away = S.pet.lastCare ? dayDiff(S.pet.lastCare, today()) : 0;
    if (away > 0) { S.pet.hearts = Math.max(1, S.pet.hearts - away); S.pet.lastCare = today(); }
    return S;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memoryOnly = true; }
  }
  function reset() { S = fresh(); save(); return S; }

  const get = () => S;
  const totalStars = () => Object.values(S.levels).reduce((t, l) => t + (l.stars || 0), 0);
  const stage = () => { const s = totalStars(); let st = 0; GROW_AT.forEach((n, i) => { if (s >= n) st = i; }); return st; };
  const levelStars = id => (S.levels[id] && S.levels[id].stars) || 0;
  const worldLevels = w => LEVELS.filter(l => l.world === w);
  const worldDone = w => worldLevels(w).every(l => levelStars(l.id) > 0);
  const worldOpen = w => w === 1 || S.settings.unlockAll || worldDone(w - 1);
  function levelOpen(id) {
    if (S.settings.unlockAll) return true;
    const i = LEVELS.findIndex(l => l.id === id);
    return i === 0 || levelStars(LEVELS[i - 1].id) > 0;
  }
  function nextLevel() {
    const l = LEVELS.find(l => levelStars(l.id) === 0);
    return l || LEVELS[LEVELS.length - 1];
  }
  function highestIndex() {
    let hi = 0;
    LEVELS.forEach((l, i) => { if (levelStars(l.id) > 0) hi = i; });
    return hi;
  }

  /* How often each key is missed, 0..1, only counted once there is enough data */
  function weakKeys() {
    const out = {};
    for (const k in S.keys) {
      const { hit = 0, miss = 0 } = S.keys[k];
      if (hit + miss >= 8) out[k] = Math.min(1, (miss / (hit + miss)) * 3);
    }
    return out;
  }
  function noteKey(ch, ok) {
    const k = ch.toLowerCase();
    const rec = S.keys[k] || (S.keys[k] = { hit: 0, miss: 0 });
    if (ok) rec.hit++; else rec.miss++;
    // Let old mistakes fade so the chart shows how she types now
    if (rec.hit + rec.miss > 200) { rec.hit = Math.round(rec.hit * 0.7); rec.miss = Math.round(rec.miss * 0.7); }
  }

  /* Returns the daily streak bonus if this is the first finished level today, else 0 */
  function touchStreak() {
    const t = today();
    if (S.streak.last === t) return 0;
    S.streak.count = (S.streak.last && dayDiff(S.streak.last, t) === 1) ? S.streak.count + 1 : 1;
    S.streak.last = t;
    return Math.min(S.streak.count, 7) * 2;
  }

  function addCoins(n) { S.coins = Math.max(0, S.coins + n); }

  return { load, save, reset, get, totalStars, stage, levelStars, worldLevels, worldDone, worldOpen, levelOpen,
    nextLevel, highestIndex, weakKeys, noteKey, touchStreak, addCoins, today, isMemoryOnly: () => memoryOnly };
})();

/* ---- audio.js ---- */
/* Dragon Keys - sound effects, made in the browser so there are no files to load */
'use strict';

const Sound = (() => {
  let ac = null, master = null, on = true;
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];          // major pentatonic steps
  const freq = semis => 440 * Math.pow(2, (semis - 9) / 12);       // 0 = middle C

  function ensure() {
    if (!on) return false;
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ac = new AC(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume();
      return true;
    } catch (e) { return false; }
  }

  function tone(f, dur, { type = 'sine', vol = 0.2, at = 0, slide = 0, attack = 0.005 } = {}) {
    if (!ensure()) return;
    const t0 = ac.currentTime + at;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, { vol = 0.2, at = 0, from = 1200, to = 300, q = 1 } = {}) {
    if (!ensure()) return;
    const t0 = ac.currentTime + at, n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t0);
  }

  const api = {
    /* each right key plays the next note of a little tune, so words sound like melodies */
    key(step = 0) { tone(freq(SCALE[step % SCALE.length] + 12), 0.11, { type: 'triangle', vol: 0.16 }); },
    miss() { tone(150, 0.16, { type: 'square', vol: 0.07, slide: 0.6 }); },

  /* ---------------- Hands for the finger guide ---------------- */
  function hand(side) {
    const ids = side === 'left' ? ['L1', 'L2', 'L3', 'L4'] : ['R1', 'R2', 'R3', 'R4'];
    // drawn as a left hand (pinky first); the right hand is mirrored
    const f = [[20, 66, 25, 86], [50, 38, 27, 112], [82, 24, 27, 124], [114, 42, 27, 108]];

    const finger = fingerOf(base);
    const shiftKey = shift ? (finger[0] === 'L' ? 'ShiftRight' : 'ShiftLeft') : null;
    return { base, shift, finger, shiftKey, shiftFinger: shiftKey ? SPECIAL_FINGER[shiftKey] : null };
  }
  function fingerName(f) {
    if (f === 'T') return 'thumb';
    return (f[0] === 'L' ? 'left ' : 'right ') + FINGER_LABEL[f[1]];
  }

  function create(root) {
    const keyEls = {};
    root.querySelectorAll('.key').forEach(el => { keyEls[el.dataset.k] = el; });
    const hints = { L: root.querySelector('.hint-left'), R: root.querySelector('.hint-right') };
    let targets = [];

    function clear() {
      targets.forEach(el => el.classList.remove('target'));
      targets = [];
      root.querySelectorAll('.fg.use').forEach(el => el.classList.remove('use'));
      Object.values(hints).forEach(h => h && h.classList.remove('show'));
    }
    function useFinger(f, text) {
      const sel = f === 'T' ? '.fg-T' : '.fg-' + f;
      root.querySelectorAll(sel).forEach(el => { el.classList.add('use'); el.style.setProperty('--fc', Art.FINGER_COLORS[f]); });
      const sides = f === 'T' ? ['L', 'R'] : [f[0]];
      sides.forEach(s => { const h = hints[s]; if (h) { h.textContent = text; h.style.setProperty('--fc', Art.shade(Art.FINGER_COLORS[f], -0.22)); h.classList.add('show'); } });
    }
    function target(ch) {
      clear();
      if (ch == null) return;
      const p = plan(ch);
      const el = keyEls[p.base];
      if (el) { el.classList.add('target'); targets.push(el); }
      useFinger(p.finger, p.finger === 'T' ? 'thumb' : FINGER_LABEL[p.finger[1]]);
      if (p.shiftKey) {
        const s = keyEls[p.shiftKey];
        if (s) { s.classList.add('target'); targets.push(s); }
        useFinger(p.shiftFinger, 'pinky holds Shift');
      }
    }
    function setLearned(keys) {
      const known = keys == null ? null : new Set(keys);
      const shift = keys == null || keys.includes('SHIFT');
      for (const k in keyEls) {
        let on;
        if (k === ' ') on = true;
        else if (k === 'ShiftLeft' || k === 'ShiftRight') on = shift;
        else if (k.length > 1) on = false;
        else on = known ? known.has(k) : !/[0-9`\-=\[\]\\]/.test(k);
        keyEls[k].classList.toggle('off', !on);
      }
    }
    function press(e, ok) {
      let k = e.code === 'ShiftLeft' || e.code === 'ShiftRight' ? e.code : e.key;
      if (k.length === 1) k = SHIFTED[k] || k.toLowerCase();
      const el = keyEls[k];
      if (!el) return;
      const cls = ok == null ? ['down'] : ['down', ok ? 'ok' : 'bad'];
      el.classList.add(...cls);
      setTimeout(() => el.classList.remove(...cls), 150);
    }
    return { target, clear, setLearned, press, keyEls };
  }

  return { markup, create, plan, fingerName, fingerOf };
})();

/* ---- ui.js ---- */
/* Dragon Keys - the app shell: sizing, screens, pop-ups, shared bits of UI */
'use strict';

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = Art.ic;
const cleanName = (s, fallback) => (String(s || '').replace(/[^A-Za-z]/g, '').slice(0, 10).replace(/^./, c => c.toUpperCase())) || fallback;

const App = (() => {
  let stage, screensEl, toastEl, current = null, currentName = '', W = 1280, scale = 1, last = 0;
  let modalEl = null, modalKey = null, modalClose = null, toastTimer = 0;
  const screens = {};
  const timers = new Set();

  function register(name, def) { screens[name] = def; }

  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / 1280, vh / 720);
    W = Math.round(clamp(vw / scale, 1280, 1680));
    stage.style.width = W + 'px';
    stage.style.transform = `translate(${-W * scale / 2}px, ${-360 * scale}px) scale(${scale})`;
    Scene.resize(W, 720, scale); FX.resize(W, 720, scale);
  }

  /* timers that are cancelled automatically when the screen changes */
  function later(fn, ms) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; }
  function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

  function go(name, params = {}) {
    if (current && current.exit) current.exit();
    clearTimers();
    closeModal(true);
    FX.clear();
    Scene.gems.length = 0;
    const old = screensEl.lastElementChild;
    const el = document.createElement('div');
    el.className = 'screen scr-' + name;
    screensEl.appendChild(el);
    if (old) { old.classList.add('leaving'); setTimeout(() => old.remove(), 250); }
    current = screens[name]; currentName = name;
    current.el = el;
    current.enter(el, params);
  }

  function modal(html, opts = {}) {
    closeModal(true);
    modalEl = document.createElement('div');
    modalEl.className = 'modal-wrap';
    modalEl.innerHTML = html;
    modalKey = opts.key || null; modalClose = opts.onClose || null;
    stage.appendChild(modalEl);
    modalEl.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (b && opts.act) { opts.act(b.dataset.act, b, e); return; }
      if (e.target === modalEl && opts.dismiss) closeModal();
    });
    return modalEl;
  }
  function closeModal(silent) {
    if (!modalEl) return;
    const cb = modalClose;
    modalEl.remove(); modalEl = null; modalKey = null; modalClose = null;
    if (cb && !silent) cb();
  }

  function toast(msg, ms = 2600) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  /* position of an element in stage coordinates (ax, ay pick a point inside it) */
  function pos(el, ax = 0.5, ay = 0.5) {
    const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x: (r.left + r.width * ax - s.left) / scale, y: (r.top + r.height * ay - s.top) / scale };
  }
  const mouthPos = svg => pos(svg, 0.80, 0.585);

  function petSvg(cls = '', over = {}) {
    const S = Store.get();
    return Art.dragon(Object.assign({ color: S.pet.color, stage: Store.stage(), wear: S.pet.wear, cls }, over));
  }

  const sysButtons = () => `<button class="btn white round" data-g="sound" aria-label="Sound">${ic(Store.get().settings.sound ? 'soundOn' : 'soundOff')}</button>
        <button class="btn white round" data-g="full" aria-label="Full screen">${ic('full')}</button>`;

  function hud({ back = false, title = '', sub = '' } = {}) {
    const S = Store.get();
    return `<div class="hud">
      ${back ? `<button class="btn white round" data-act="back" aria-label="Back">${ic('back')}</button>` : ''}
      <div class="hud-title">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
      <div class="hud-right">
        ${S.streak.count > 1 ? `<div class="pill" title="Days in a row">${ic('flame')}<b>${S.streak.count}</b></div>` : ''}
        <div class="pill" title="Stars">${ic('star')}<b class="star-count">${Store.totalStars()}</b></div>
        <div class="pill coin-pill" title="Coins">${ic('coin')}<b class="coin-count">${S.coins}</b></div>
        ${sysButtons()}
      </div></div>`;
  }

  function countTo(el, from, to, ms = 700) {
    if (!el) return;
    const t0 = performance.now();
    const step = now => {
      const u = Math.min(1, (now - t0) / ms);
      el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - u, 3)));
      if (u < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function refreshCoins(from) {
    const S = Store.get();
    $$('.coin-count').forEach(el => { if (from == null) el.textContent = S.coins; else countTo(el, from, S.coins); });
    $$('.star-count').forEach(el => { el.textContent = Store.totalStars(); });
  }

  function onKey(e) {
    Sound.unlock();
    const inField = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    if (!inField && (e.key === ' ' || e.key === "'" || e.key === '/' || e.key === 'Backspace' || e.key === 'Tab')) e.preventDefault();
    if (e.repeat) return;
    if (modalEl) {
      if (e.key === 'Escape' && modalEl.querySelector('.x')) { closeModal(); return; }
      if (modalKey) modalKey(e);
      return;
    }
    if (inField && e.key !== 'Enter') return;
    if (current && current.key) current.key(e);
  }

  function onGlobalClick(e) {
    Sound.unlock();
    // keep keyboard focus off buttons so Space and Enter never press one by accident while typing
    const a = document.activeElement;
    if (a && a.tagName === 'BUTTON') a.blur();
    const g = e.target.closest('[data-g]');
    if (!g) return;
    const S = Store.get();
    if (g.dataset.g === 'sound') {
      S.settings.sound = !S.settings.sound; Sound.setOn(S.settings.sound); Store.save();
      $$('[data-g="sound"]').forEach(b => { b.innerHTML = ic(S.settings.sound ? 'soundOn' : 'soundOff'); });
      Sound.click();
    } else if (g.dataset.g === 'full') {
      const d = document;
      if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen(); }
      else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
    }
  }

  function frame(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if (!current || !current.noScene) { Scene.update(dt); Scene.draw(); }
    if (current && current.tick) current.tick(dt);
    FX.update(dt); FX.draw();
    requestAnimationFrame(frame);
  }

  function start() {
    stage = $('#stage'); screensEl = $('#screens'); toastEl = $('#toast');
    Scene.init($('#bg')); FX.init($('#fx'));
    const S = Store.load();
    Sound.setOn(S.settings.sound);
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('keydown', onKey);
    stage.addEventListener('click', onGlobalClick);
    go('title');
    requestAnimationFrame(frame);
  }

  return { register, go, modal, closeModal, toast, pos, mouthPos, petSvg, hud, sysButtons, countTo, refreshCoins, later, start,
    get W() { return W; }, get scale() { return scale; }, get screen() { return currentName; }, get hasModal() { return !!modalEl; } };
})();

/* ---- screens.js ---- */
/* Dragon Keys - title screen, hatching the egg, the den and the shop */
'use strict';

/* ---------------- Title ---------------- */
App.register('title', {

    this.t = 0; this.pet = $('.title-pet', el);

      this.pet.style.transform = `translate(${Math.sin(this.t * 0.6) * 60}px, ${Math.sin(this.t * 1.7) * 16}px) rotate(${Math.sin(this.t * 1.7 + 1) * 4}deg)`;
      if (Math.random() < dt * 8) { const p = App.pos(this.pet, 0.1, 0.6); FX.trail(p.x, p.y, ['#fff7b0', '#ffd23f', '#ffffff']); }
    }

/* ---------------- First run: name, hatch the egg, name the dragon ---------------- */
App.register('hatch', {
  enter(el) {
    Scene.setTheme('meadow'); Scene.setHorizon(0); Scene.setSpeed(16);
    this.step = 'name'; this.taps = 0;
    el.innerHTML = `<div class="hatch-card glass" style="top:230px">
        <h2>Welcome to Dragon Keys!</h2>
        <p style="font-size:24px;font-weight:500;margin:10px 0 0;color:var(--ink-soft)">What is your name?</p>
        <div class="name-form"><input class="text" maxlength="10" placeholder="Your name" autocomplete="off" spellcheck="false">
          <button class="btn green" data-act="next">Next ${ic('next')}</button></div>
      </div>`;
    el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) this.act(b.dataset.act); });
    setTimeout(() => { const i = $('input', el); if (i) i.focus(); }, 60);
  },
  act(a) {
    const S = Store.get(), el = this.el;
    if (a === 'next' && this.step === 'name') {
      S.kid = cleanName($('input', el).value, 'Friend');
      Store.save(); Sound.click();
      this.showEgg();
    } else if (a === 'dice') {
      $('input', el).value = Content.pick(PET_NAMES); Sound.pop();
    } else if (a === 'done' && this.step === 'petname') {
      S.pet.name = cleanName($('input', el).value, 'Ember');
      S.hatched = true; S.pet.hearts = 3; Store.save(); Sound.levelUp();
      App.go('den', { welcome: true });
    }
  },
  showEgg() {
    const S = Store.get(), el = this.el;
    this.step = 'egg';
    el.innerHTML = `<div class="coach glass">Look, <b>${esc(S.kid)}</b>, a dragon egg! Rest your pointer fingers on the two keys with little bumps:
        <span class="keycap" style="--kc:${Art.FINGER_COLORS.L4}">F</span> and <span class="keycap" style="--kc:${Art.FINGER_COLORS.R4}">J</span>. Tap them to help it hatch!</div>
      <div class="hatch-meter">${'<i></i>'.repeat(8)}</div>
      <div class="hatch-egg">${Art.egg(S.pet.color)}</div>
      <div class="kb-dock glass">${Keyboard.markup()}</div>`;
    this.kb = Keyboard.create(el);
    this.kb.setLearned('fj');
    this.kb.target('f');
  },
  key(e) {
    if (e.key === 'Enter') { if (this.step === 'name') this.act('next'); else if (this.step === 'petname') this.act('done'); return; }
    if (this.step !== 'egg' || e.key.length !== 1) return;
    const want = this.taps % 2 ? 'j' : 'f', ok = e.key.toLowerCase() === want;
    this.kb.press(e, ok);
    const eggEl = $('.egg', this.el);
    if (!ok) { Sound.miss(); return; }
    this.taps++;
    $$('.hatch-meter i', this.el).forEach((d, i) => d.classList.toggle('on', i < this.taps));
    eggEl.classList.remove('shake'); void eggEl.getBoundingClientRect(); eggEl.classList.add('shake');
    eggEl.classList.remove('k1', 'k2', 'k3', 'k4'); eggEl.classList.add('k' + Math.min(4, Math.ceil(this.taps / 2)));
    Sound.crack();
    const p = App.pos(eggEl, 0.5, 0.45);
    FX.burst(p.x, p.y, { n: 8, speed: 200, colors: ['#fff6dc', '#ffd23f', '#ffffff'], ring: false });
    if (this.taps >= 8) this.hatch(); else this.kb.target(this.taps % 2 ? 'j' : 'f');
  },
  hatch() {
    const S = Store.get(), el = this.el;
    this.step = 'hatching'; this.kb.clear();
    const box = $('.hatch-egg', el), p = App.pos(box, 0.5, 0.5);
    Sound.hatch(); FX.shells(p.x, p.y, 22); FX.burst(p.x, p.y, { n: 30, speed: 480, size: 10 }); FX.confetti(120);
    box.innerHTML = Art.dragon({ color: S.pet.color, stage: 0, cls: 'happy' });
    $('.kb-dock', el).remove(); $('.hatch-meter', el).remove();
    $('.coach', el).innerHTML = `It hatched! Say hello to your baby dragon.`;
    App.later(() => {
      this.step = 'petname';
      const card = document.createElement('div');
      card.className = 'hatch-card glass';
      card.innerHTML = `<h2>What will you call your dragon?</h2>
        <div class="name-form"><input class="text" maxlength="10" placeholder="Dragon name" autocomplete="off" spellcheck="false">
          <button class="btn yellow round" data-act="dice" title="Pick a name for me">${ic('retry')}</button>
          <button class="btn green" data-act="done">Let's go! ${ic('next')}</button></div>`;
      el.appendChild(card);
      $('input', card).focus();
    }, 1500);
  },
});

/* ---------------- The den ---------------- */
App.register('den', {
  noScene: true,
  enter(el, params = {}) {
    this.params = params; this.trayOpen = false; this.busy = false;
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (b) this.act(b.dataset.act, b);
      else if (this.trayOpen && !e.target.closest('.tray')) { this.trayOpen = false; this.render(); }
    });
    this.render();
    const S = Store.get();
    if (params.welcome) this.say(`Hi ${S.kid}! I'm ${S.pet.name}. Let's learn to type together!`);
    else this.say(this.greeting());
    this.checkGrowth();
  },
  greeting() {
    const S = Store.get(), next = Store.nextLevel();
    if (S.pet.hearts <= 1) return 'My tummy is rumbling. Do you have a snack?';
    const lines = [
      `Welcome back, ${S.kid}! Ready to fly?`,
      `Next level: ${next.title}`,
      'Careful fingers earn the most stars.',
      'Try not to peek at your hands!',
    ];
    if (S.streak.count >= 2) lines.push(`${S.streak.count} days in a row. You are on fire!`);
    if (Store.totalStars() >= 6) lines.push(`We have ${Store.totalStars()} stars already!`);

  },
  say(text) {
    const old = $('.bubble', this.el); if (old) old.remove();

  },

    const miniOpen = Store.worldDone(1) || S.settings.unlockAll;

    const keepBubble = $('.bubble', el);
    el.innerHTML = `<div class="room-wrap">${Art.room(S.owned)}</div>
      <div class="den-pets">
        ${S.friends.map(f => `<div class="fr-${f}" data-act="friend" data-f="${f}">${Art.friend(f)}</div>`).join('')}
        <div class="den-pet" data-act="pet" style="width:${260 + st * 22}px;left:${640 - (260 + st * 22) / 2}px;top:${580 - (260 + st * 22) * 1.012}px">${App.petSvg()}</div>
      </div>
      ${App.hud({ title: `${S.pet.name}'s Den` })}
      <div class="pet-card glass">
        <h3>${esc(S.pet.name)}</h3><div class="stage">${STAGE_NAMES[st]}</div>
        <div class="hearts" title="Feed your dragon to fill its hearts">${hearts}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="bar-label">${nextAt ? `${stars} of ${nextAt} stars to grow bigger` : 'Fully grown. What a dragon!'}${S.pet.hearts >= 5 ? '<br><b style="color:#d13a79">Happy dragon: +20% coins</b>' : ''}</div>
      </div>
      <div class="den-actions">
        <button class="btn blue" data-act="shop">${ic('bag')}Shop</button>
        <button class="btn pink" data-act="feed">${ic('food')}Feed</button>
        <button class="btn green big pulse" data-act="play">${ic('play')}Play</button>
        <button class="btn ${miniOpen ? 'orange' : 'grey'}" data-act="mini">${ic(miniOpen ? 'gem' : 'lock')}Gem Storm</button>
        <button class="btn white" data-act="parent">${ic('chart')}Grown-ups</button>
      </div>
      ${this.trayOpen ? this.trayHtml() : ''}`;
    if (keepBubble) el.appendChild(keepBubble);

  trayHtml() {

  },

    this.say(Content.pick([`I love flying with you, ${S.kid}!`, 'That tickles!', 'Can we practise some more?', 'Rawr! That means thank you.', this.greeting()]));
  },
  feed(id, btn) {
    if (this.busy) return;
    const S = Store.get(), food = SHOP.food.find(f => f.id === id);
    if (!food || !(S.food[id] > 0)) return;
    this.busy = true;
    S.food[id]--; S.pet.hearts = Math.min(5, S.pet.hearts + food.hearts); S.pet.lastCare = Store.today(); Store.save();
    const from = App.pos(btn), petBox = $('.den-pet', this.el), to = App.mouthPos($('svg', petBox));
    const fly = document.createElement('div'); fly.className = 'fly-item'; fly.innerHTML = Art.item(id);
    fly.style.left = (from.x - 35) + 'px'; fly.style.top = (from.y - 35) + 'px';
    this.el.appendChild(fly);
    this.trayOpen = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { fly.style.left = (to.x - 30) + 'px'; fly.style.top = (to.y - 30) + 'px'; fly.style.transform = 'scale(.5) rotate(200deg)'; }));
    Sound.whoosh();
    App.later(() => {
      fly.remove();
      this.render();
      const svg = $('.den-pet svg', this.el);
      svg.classList.add('eating'); Sound.munch();
      App.later(() => {
        svg.classList.remove('eating'); svg.classList.add('happy');
        const p = App.pos(svg, 0.6, 0.2); FX.hearts(p.x, p.y, 7);
        if (food.fire) {
          this.say('SPICY!');
          svg.classList.add('mouth-open'); Sound.fire();
          let n = 0; const m = App.mouthPos(svg);
          const iv = setInterval(() => { FX.fire(m.x + 10, m.y, 0.96, -0.26, 1); if (++n > 12) clearInterval(iv); }, 50);
        } else this.say(Content.pick(['Yum! Thank you!', 'Delicious!', 'My favourite!']));
        App.later(() => { svg.classList.remove('happy', 'mouth-open'); this.busy = false; }, 1100);
      }, 1250);
    }, 580);
  },
  /* show a little party when the dragon has grown since she last saw it */
  checkGrowth() {
    const S = Store.get(), st = Store.stage();
    if (st <= S.seenStage) return;
    const before = S.seenStage; S.seenStage = st; Store.save();
    App.later(() => {
      Sound.levelUp(); FX.confetti(110);
      App.modal(`<div class="modal unlock"><h2>${esc(S.pet.name)} grew!</h2><p>All those stars made your dragon bigger and stronger.</p>
        <div class="grow">${App.petSvg('', { stage: before })}${ic('next')}${App.petSvg('happy')}</div>
        <p style="margin-top:10px"><b style="color:var(--purple-d)">${STAGE_NAMES[st]}</b></p>
        <div class="row"><button class="btn green" data-act="ok">Hooray!</button></div></div>`,
      { act: () => App.closeModal(), key: e => { if (e.key === 'Enter' || e.key === ' ') App.closeModal(); }, onClose: () => this.render() });
    }, 700);
  },
  exit() { clearTimeout(this.bubbleT); },
});

/* ---------------- The shop ---------------- */
const Shop = (() => {
  let tab = 'food', done = null;
  const TABS = [['food', 'Snacks'], ['wear', 'Dress up'], ['color', 'Colours'], ['room', 'Den']];

  function open(startTab, onClose) {
    if (startTab) tab = startTab;
    done = onClose;
    draw();
  }
  function goodsHtml() {
    const S = Store.get();
    const price = (id, p) => `<button class="btn yellow small" data-act="buy" data-id="${id}" data-price="${p}">${ic('coin')} ${p}</button>`;
    if (tab === 'food') return SHOP.food.map(f => `<div class="good">${Art.item(f.id)}<b>${f.name}</b>
      <span style="font-size:15px;color:var(--ink-soft);font-weight:500">${S.food[f.id] ? 'You have ' + S.food[f.id] : (f.fire ? 'Breathes fire!' : '+' + f.hearts + (f.hearts > 1 ? ' hearts' : ' heart'))}</span>${price(f.id, f.price)}</div>`).join('');
    if (tab === 'wear') return SHOP.wear.map(w => {
      const own = S.owned[w.id], on = S.pet.wear.includes(w.id);
      return `<div class="good ${on ? 'on' : ''}">${Art.item(w.id)}<b>${w.name}</b>${own
        ? `<button class="btn ${on ? 'white' : 'green'} small" data-act="wear" data-id="${w.id}">${on ? 'Take off' : 'Wear'}</button>` : price(w.id, w.price)}</div>`;
    }).join('');
    if (tab === 'color') return Object.entries(DRAGON_COLORS).map(([id, c]) => {
      const own = id === 'emerald' || S.owned['c-' + id], on = S.pet.color === id;
      const sw = `<div class="swatch" style="--sm:${c.main};--sl:${c.light};--sd:${c.dark};--sw:${c.wing};--swd:${c.wingDark}"></div>`;
      let btn;
      if (on) btn = `<button class="btn white small" disabled>${ic('check')} Wearing</button>`;
      else if (own) btn = `<button class="btn green small" data-act="color" data-id="${id}">Use</button>`;
      else if (c.price < 0) btn = `<span style="font-size:15px;font-weight:500;color:var(--ink-soft);line-height:1.2">${ic('lock')} Finish Dragon Summit</span>`;
      else btn = price('c-' + id, c.price);
      return `<div class="good ${on ? 'on' : ''}">${sw}<b>${c.name}</b>${btn}</div>`;
    }).join('');
    return SHOP.room.map(r => `<div class="good ${S.owned[r.id] ? 'on' : ''}">${Art.item(r.id)}<b>${r.name}</b>${S.owned[r.id]
      ? `<span style="font-size:16px;font-weight:600;color:var(--green-d)">${ic('check')} In your den</span>` : price(r.id, r.price)}</div>`).join('');
  }
  function draw() {
    const S = Store.get();
    App.modal(`<div class="modal shop"><button class="x" data-act="close" aria-label="Close">${ic('close')}</button>
      <div class="shop-side"><div style="font-size:26px;font-weight:700">${esc(S.pet.name)}</div>${App.petSvg()}
        <div class="pill">${ic('coin')}<b class="coin-count">${S.coins}</b></div></div>
      <div class="shop-main"><div class="tabs">${TABS.map(([id, name]) => `<button class="tab ${id === tab ? 'on' : ''}" data-act="tab" data-id="${id}">${name}</button>`).join('')}</div>
        <div class="goods">${goodsHtml()}</div></div></div>`,
    { act, onClose: () => { if (done) done(); }, dismiss: true });
  }
  function act(a, b) {
    const S = Store.get(), id = b.dataset.id;
    if (a === 'close') { Sound.click(); App.closeModal(); return; }
    if (a === 'tab') { tab = id; Sound.pop(); draw(); return; }
    if (a === 'wear') {
      const slot = Art.wearSlot(id);
      if (S.pet.wear.includes(id)) S.pet.wear = S.pet.wear.filter(w => w !== id);
      else S.pet.wear = S.pet.wear.filter(w => Art.wearSlot(w) !== slot).concat(id);
      Store.save(); Sound.pop(); draw(); return;
    }
    if (a === 'color') { S.pet.color = id; Store.save(); Sound.pop(); draw(); return; }
    if (a === 'buy') {
      const cost = +b.dataset.price;
      if (S.coins < cost) { Sound.nope(); App.toast(`You need ${cost - S.coins} more coins. Play a level to earn some!`); return; }
      const before = S.coins, p = App.pos(b);
      Store.addCoins(-cost);
      if (tab === 'food') S.food[id] = (S.food[id] || 0) + 1;
      else {
        S.owned[id] = true;
        if (tab === 'wear') { const slot = Art.wearSlot(id); S.pet.wear = S.pet.wear.filter(w => Art.wearSlot(w) !== slot).concat(id); }
        if (tab === 'color') S.pet.color = id.slice(2);
      }
      Store.save(); Sound.buy();
      draw();
      FX.burst(p.x, p.y, { n: 16, colors: ['#ffd23f', '#fff7b0', '#ff9f43'] });
      App.refreshCoins(before);
    }
  }
  return { open };
})();

/* Dragon Keys - the world map */
'use strict';

App.register('map', {
  enter(el, params = {}) {
    const next = Store.nextLevel();
    this.world = params.world || next.world;
    Scene.setHorizon(0); Scene.setSpeed(14);
    el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) this.act(b.dataset.act, b); });
    this.render();
    if (params.open) this.card(params.open);
  },
  spots(n) {
    return n === 6
      ? [[170, 505], [372, 385], [574, 505], [776, 380], [968, 495], [1128, 365]]
      : [[230, 490], [490, 372], [770, 490], [1040, 366]];
  },
  render() {
    const el = this.el, w = WORLDS[this.world - 1], open = Store.worldOpen(this.world);
    Scene.setTheme(w.theme);
    const levels = Store.worldLevels(this.world), pts = this.spots(levels.length), next = Store.nextLevel();
    const got = levels.reduce((t, l) => t + Store.levelStars(l.id), 0);
    // a smooth dotted trail through the level spots
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += `C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
    }
    let petAt = null;
    const nodes = levels.map((l, i) => {
      const stars = Store.levelStars(l.id), unlocked = Store.levelOpen(l.id) && open, isNext = l.id === next.id && stars === 0 && unlocked;
      if (isNext) petAt = pts[i];
      const cls = ['node', stars ? 'done' : '', l.kind === 'review' ? 'review' : '', !unlocked ? 'locked' : '', isNext ? 'next' : ''].join(' ');
      const face = !unlocked ? ic('lock') : l.kind === 'review' ? ic('gem') : (i + 1);
      const label = l.title.replace(/ Treasure Flight$/, '').replace(/^(Sunny Meadow|Meadow|Sky Peaks|Crystal Cave)$/, 'Treasure Flight');
      return `<button class="${cls}" style="left:${pts[i][0]}px;top:${pts[i][1]}px" data-act="level" data-id="${l.id}" ${unlocked ? '' : 'tabindex="-1"'}>
        <span class="node-dot">${face}</span>
        <span class="node-stars">${[0, 1, 2].map(s => ic(s < stars ? 'star' : 'starOff')).join('')}</span>
        <span class="node-label">${esc(label)}</span></button>`;
    }).join('');
    if (!petAt && open) { const i = levels.findIndex(l => l.id === next.id); petAt = pts[i >= 0 ? i : pts.length - 1]; }
    el.innerHTML = `${App.hud({ back: true, title: 'World Map' })}
      <div class="map-banner glass"><h2>World ${w.id}: ${w.name}</h2><p>${w.skill} &nbsp;·&nbsp; ${ic('star')} ${got} of ${levels.length * 3}</p></div>
      <div class="map-area">
        ${open ? `<svg class="path" viewBox="0 0 1280 720"><path d="${d}" fill="none" stroke="rgba(40,25,110,.35)" stroke-width="16" stroke-linecap="round" stroke-dasharray="2 30" transform="translate(0 6)"/>
          <path d="${d}" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 30"/></svg>${nodes}
          ${petAt ? `<div class="map-pet" style="left:${petAt[0] - 138}px;top:${petAt[1] - 150}px">${App.petSvg('fly')}</div>` : ''}`
        : `<div class="map-lock glass" style="position:absolute">${ic('lock')}<h3>${w.name} is still locked</h3><p>Finish every level in ${WORLDS[this.world - 2].name} to open it.</p></div>`}
      </div>
      ${this.world > 1 ? `<button class="btn white round map-arrow l" data-act="prev" aria-label="Previous world">${ic('back')}</button>` : ''}
      ${this.world < WORLDS.length ? `<button class="btn white round map-arrow r" data-act="nextw" aria-label="Next world">${ic('next')}</button>` : ''}
      <div class="map-dots">${WORLDS.map(x => `<button class="${x.id === this.world ? 'on' : ''} ${Store.worldOpen(x.id) ? '' : 'locked'}" data-act="world" data-id="${x.id}" aria-label="World ${x.id}">${Store.worldOpen(x.id) ? x.id : ic('lock')}</button>`).join('')}</div>`;
  },
  act(a, b) {
    if (a === 'back') { Sound.click(); App.go('den'); }
    else if (a === 'prev') { this.world--; Sound.whoosh(); this.render(); }
    else if (a === 'nextw') { this.world++; Sound.whoosh(); this.render(); }
    else if (a === 'world') { this.world = +b.dataset.id; Sound.whoosh(); this.render(); }
    else if (a === 'level') { Sound.pop(); this.card(b.dataset.id); }
  },
  card(id) {
    const l = LEVELS.find(x => x.id === id), rec = Store.get().levels[id];
    if (!l || !Store.levelOpen(id)) return;
    const n = Store.worldLevels(l.world).indexOf(l) + 1;
    const start = () => { Sound.click(); App.go('level', { id }); };
    App.modal(`<div class="modal lv-card"><button class="x" data-act="close" aria-label="Close">${ic('close')}</button>
      <p style="margin:0">World ${l.world} · Level ${n}</p><h2>${esc(l.title)}</h2>
      ${LevelInfo.html(l)}
      ${rec && rec.plays ? `<div class="best">${[0, 1, 2].map(s => ic(s < (rec.stars || 0) ? 'star' : 'starOff')).join('')} Best: ${rec.bestAcc || 0}% · ${rec.bestWpm || 0} words a minute</div>` : ''}
      <div class="row"><button class="btn green big" data-act="start">${ic('play')} Start</button></div></div>`,
    { dismiss: true, act: a => { if (a === 'start') start(); else App.closeModal(); }, key: e => { if (e.key === 'Enter' || e.key === ' ') start(); } });
  },
  key(e) {
    if (e.key === 'ArrowLeft' && this.world > 1) this.act('prev');
    else if (e.key === 'ArrowRight' && this.world < WORLDS.length) this.act('nextw');
    else if (e.key === 'Enter') { const n = Store.nextLevel(); if (n.world === this.world && Store.worldOpen(this.world)) this.card(n.id); }
    else if (e.key === 'Escape') this.act('back');
  },
});

/* What a level teaches, shown on the map card and at the start of the level */
const LevelInfo = {
  html(l) {
    if (l.kind === 'keys') {
      const caps = [...l.keys].map(k => {
        const f = Keyboard.fingerOf(k);
        return `<div><span class="keycap" style="--kc:${Art.FINGER_COLORS[f]}">${esc(k.toUpperCase())}</span>${Keyboard.fingerName(f)}</div>`;
      }).join('');
      return `<p>Two new keys to learn:</p><div class="keys">${caps}</div>`;
    }
    if (l.intro) return `<p>${esc(l.intro)}</p>`;
    if (l.kind === 'review') return '<p>A treasure flight! Use every key you have learned to collect the gems.</p>';
    if (l.kind === 'common') return '<p>These are the words people type most often. Get them into your fingers!</p>';
    if (l.id === '4-4') return '<p>Capitals, commas and question marks, all together in real sentences.</p>';
    if (l.id.startsWith('5-5') || l.id.startsWith('5-6')) return '<p>Type the story to find out what happens.</p>';
    return '<p>Real sentences now. Keep your eyes on the screen and let your fingers find the keys.</p>';
  },
};

/* ---- level.js ---- */
/* Dragon Keys - a typing level: the dragon flies, each finished word collects a gem */
'use strict';

App.register('level', {
  GAP: 250,                      // distance between gems, in pixels
  MILESTONES: [10, 25, 50, 75, 100, 150, 200, 300],

  enter(el, { id }) {
    const S = Store.get();
    const idx = Content.levelIndex(id), level = LEVELS[idx], world = WORLDS[level.world - 1];
    this.level = level; this.idx = idx; this.t = 0;
    Scene.setTheme(world.theme); Scene.setHorizon(-250); Scene.setSpeed(40);

    const lines = Content.build(id, Store.weakKeys(), { pet: S.pet.name, kid: S.kid });
    this.wordEnds = lines.map(line => { const ends = []; for (let i = 0; i < line.length; i++) if (line[i] === ' ') ends.push(i + 1); ends.push(line.length); return ends; });
    const wordsTotal = this.wordEnds.reduce((t, e) => t + e.length, 0);
    const hues = { meadow: [200, 330, 45, 275], peaks: [190, 50, 320, 130], cave: [50, 185, 320, 95], castle: [45, 190, 330, 130], summit: [130, 190, 50, 320] }[world.theme];
    this.gemList = Array.from({ length: wordsTotal }, (_, i) => ({ D: (i + 1) * this.GAP, y: 190 + Math.sin(i * 1.9) * 42, hue: hues[i % hues.length] }));
    this.L = { lines, li: 0, pos: 0, wi: 0, err: false, total: lines.reduce((t, l) => t + l.length, 0), done: 0, first: 0, errors: 0,
      streak: 0, best: 0, activeMs: 0, lastT: 0, phase: 'intro', gemsGot: 0, wordsDone: 0, wordsTotal, note: 0, kps: 0, d: 0 };
    this.fly = { y: 180, vy: 0 };

    const n = Store.worldLevels(level.world).indexOf(level) + 1;
    el.innerHTML = `<div class="lv-top">
        <button class="btn white round" data-act="pause" aria-label="Pause">${ic('pause')}</button>
        <div class="hud-title">${esc(level.title)}<small>World ${level.world} · Level ${n}</small></div>
        <div class="lv-progress"><i></i><b>${ic('gem')}</b></div>
        <div class="pill acc" title="Accuracy">${ic('target')}<b>100%</b></div>
        <div class="pill streak" title="Right keys in a row">${ic('flame')}<b>0</b></div>
        <div class="pill gems" title="Gems">${ic('gem')}<b>0</b></div>
        ${App.sysButtons()}
      </div>
      <div class="flyer">${App.petSvg('fly')}</div>
      <div class="lv-col">
        <div class="prompt glass"><div class="next-line"></div></div>
        <div class="kb-panel glass">${Keyboard.markup()}</div>
      </div>
      <div class="lv-banner glass"><h2>${esc(level.title)}</h2>${LevelInfo.html(level)}
        <p>${level.world === 1 ? 'Rest your fingers on <b>A S D F</b> and <b>J K L ;</b> and try not to look down.' : 'Stars are for careful typing, not speed. Take your time.'}</p>
        <div class="go">Press <span class="keycap" style="--kc:#8f96b3;min-width:128px;height:40px;font-size:21px">SPACE</span> to start</div></div>`;
    this.flyer = $('.flyer', el); this.prompt = $('.prompt', el); this.nextEl = $('.next-line', el);
    this.kb = Keyboard.create(el);
    this.kb.setLearned(Content.keysUpTo(idx));
    el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && b.dataset.act === 'pause') this.pause(); });
    el.classList.add('intro');
    this.renderLine(false);
    this.tick(0);
  },

  renderLine(aim = true) {
    const L = this.L, line = L.lines[L.li];
    const old = $('.line', this.prompt); if (old) old.remove();
    const div = document.createElement('div'); div.className = 'line';
    div.innerHTML = [...line].map(ch => `<span class="ch${ch === ' ' ? ' sp' : ''}">${ch === ' ' ? '' : esc(ch)}</span>`).join('');
    this.prompt.insertBefore(div, this.nextEl);
    this.tiles = [...div.children];
    this.tiles[0].classList.add('cur');
    const next = L.lines[L.li + 1];
    this.nextEl.innerHTML = next ? `<small>Next</small>${esc(next)}` : '<small>Last line. Nearly there!</small>';
    if (aim) this.kb.target(line[0]);
  },

  start() {
    const b = $('.lv-banner', this.el); if (b) b.remove();
    this.el.classList.remove('intro');
    this.L.phase = 'play'; Sound.whoosh();
    this.kb.target(this.L.lines[0][0]);
  },

  key(e) {
    const L = this.L;
    if (L.phase === 'intro') { if (e.key === ' ' || e.key === 'Enter') this.start(); else if (e.key === 'Escape') this.pause(); return; }
    if (L.phase !== 'play') return;
    if (e.key === 'Escape') { this.pause(); return; }
    if (e.key.length !== 1) { if (e.key === 'Shift') this.kb.press(e); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const exp = L.lines[L.li][L.pos];
    this.capsWarn(e.getModifierState && e.getModifierState('CapsLock'));
    if (e.key === exp) { this.kb.press(e, true); this.hit(exp); }
    else if (e.key === ' ' && L.pos === 0 && L.li > 0) { /* a space after a line wrap is fine */ }
    else { this.kb.press(e, false); this.miss(e.key, exp); }
  },

  capsWarn(on) {
    let w = $('.caps-warn', this.el);
    if (on && !w) { w = document.createElement('div'); w.className = 'caps-warn'; w.textContent = 'Caps Lock is on. Press the Caps Lock key once to turn it off.'; this.el.appendChild(w); }
    else if (!on && w) w.remove();
  },

  hit(exp) {
    const L = this.L, now = performance.now();
    if (L.lastT) L.activeMs += Math.min(now - L.lastT, 4000); else L.activeMs += 400;
    L.lastT = now;
    const tile = this.tiles[L.pos];
    tile.classList.remove('cur', 'err'); tile.classList.add('done', 'popped'); if (L.err) tile.classList.add('slip');
    if (!L.err) { L.first++; Store.noteKey(exp, true); }
    L.err = false; L.done++; L.streak++; L.best = Math.max(L.best, L.streak);
    L.kps += 1; this.fly.vy -= 85;
    Sound.key(L.note++);
    const p = App.pos(tile, 0.5, 0.4);
    FX.burst(p.x, p.y, { n: 4, size: 5, speed: 150, ring: false, colors: ['#fff7b0', '#9be0b8', '#ffffff'] });
    L.pos++;
    if (L.pos === this.wordEnds[L.li][L.wi]) this.wordDone();
    if (this.MILESTONES.includes(L.streak)) this.combo(L.streak);
    if (L.pos >= L.lines[L.li].length) {
      L.li++; L.pos = 0; L.wi = 0;
      if (L.li >= L.lines.length) { this.updateHud(); this.finish(); return; }
      this.renderLine();
    } else {
      this.tiles[L.pos].classList.add('cur');
      this.kb.target(L.lines[L.li][L.pos]);
    }
    this.updateHud();
  },

  miss(typed, exp) {
    const L = this.L;
    if (!L.err) { L.err = true; L.errors++; Store.noteKey(exp, false); }
    L.streak = 0; L.note = 0;
    const tile = this.tiles[L.pos];
    tile.classList.remove('err'); void tile.offsetWidth; tile.classList.add('err');
    setTimeout(() => tile.classList.remove('err'), 260);
    this.flyer.classList.remove('wobble'); void this.flyer.offsetWidth; this.flyer.classList.add('wobble');
    Sound.miss();
    if (exp !== exp.toLowerCase() && typed === exp.toLowerCase()) App.toast('Hold Shift to make a capital letter');
    else if (exp === '?' && typed === '/') App.toast('Hold Shift and press / to make a question mark');
    this.updateHud();
  },

  wordDone() {
    const L = this.L, g = this.gemList[L.wordsDone];
    const left = App.W / 2 - 500, x = clamp(left + 188 + (g.D - L.d), left + 175, left + 400);
    FX.burst(x, this.fly.y, { n: 12, speed: 260, size: 8, colors: [`hsl(${g.hue},100%,75%)`, '#ffffff', `hsl(${g.hue},90%,60%)`], ringGrow: 150 });
    L.wordsDone++; L.gemsGot++; L.wi++; L.note = 0;
    Sound.gem();
    const pill = $('.pill.gems', this.el);
    pill.classList.remove('pulse'); void pill.offsetWidth; pill.classList.add('pulse');
    setTimeout(() => pill.classList.remove('pulse'), 400);
  },

  combo(n) {
    const svg = $('svg', this.flyer), left = App.W / 2 - 500;
    FX.text(left + 330, Math.max(120, this.fly.y - 74), `${n} in a row!`, '#ffd23f', 40);
    Sound.fire();
    svg.classList.add('mouth-open');
    let k = 0;
    const iv = setInterval(() => {
      FX.fire(left + 162, this.fly.y, 0.97, -0.12, 1.1);
      if (++k > 9 || App.screen !== 'level') { clearInterval(iv); svg.classList.remove('mouth-open'); }
    }, 45);
  },

  updateHud() {
    const L = this.L, el = this.el;
    const attempted = L.done + (L.err ? 1 : 0);
    const acc = attempted ? Math.round(L.first / attempted * 100) : 100;
    $('.pill.acc b', el).textContent = acc + '%';
    $('.pill.streak b', el).textContent = L.streak;
    $('.pill.streak', el).classList.toggle('hot', L.streak >= 10);
    $('.pill.gems b', el).textContent = L.gemsGot;
    const pct = L.done / L.total * 100;
    $('.lv-progress i', el).style.width = pct + '%';
    $('.lv-progress b', el).style.left = pct + '%';
  },

  tick(dt) {
    const L = this.L, f = this.fly;
    this.t += dt;
    L.kps *= Math.exp(-dt);
    const ends = this.wordEnds[L.li] || [1];
    const ws = L.wi ? ends[L.wi - 1] : 0, we = ends[L.wi] || 1;
    const frac = L.phase === 'play' ? clamp((L.pos - ws) / Math.max(1, we - ws), 0, 1) : 0;
    const dT = (L.wordsDone + frac) * this.GAP;
    L.d += (dT - L.d) * (1 - Math.exp(-9 * dt));
    Scene.setSpeed(L.phase === 'done' ? 560 : 46 + Math.min(6, L.kps) * 115);

    const left = App.W / 2 - 500, nextGem = this.gemList[L.wordsDone];
    const targetY = L.phase !== 'done' && nextGem ? nextGem.y : 180;
    f.vy += ((targetY - f.y) * 30 - f.vy * 7) * dt;
    f.y += f.vy * dt;
    const bob = Math.sin(this.t * 5) * 4;
    const tilt = clamp(f.vy * 0.06, -14, 14) - Math.min(7, L.kps * 1.3);
    this.flyer.style.transform = `translate(${left}px, ${f.y - 120 + bob}px) rotate(${tilt}deg)`;

    Scene.gems.length = 0;
    for (let i = L.wordsDone; i < Math.min(this.gemList.length, L.wordsDone + 7); i++) {
      const g = this.gemList[i], x = left + 188 + (g.D - L.d);
      if (x > App.W + 60) break;
      Scene.gems.push({ x, y: g.y, hue: g.hue, s: 1.15, a: 1, phase: i });
    }
    if (L.kps > 2 && Math.random() < dt * L.kps * 3) FX.trail(left + 24, f.y + 22 + bob, ['#fff7b0', '#ffd23f', '#ffffff', '#ffb3d6']);
  },

  pause() {
    const L = this.L;
    if (L.phase === 'done') return;
    L.lastT = 0; Sound.click();
    App.modal(`<div class="modal"><button class="x" data-act="resume" aria-label="Close">${ic('close')}</button><h2>Paused</h2><p>Take a breath. Your dragon will wait.</p>
      <div class="row"><button class="btn white" data-act="map">${ic('map')} Map</button><button class="btn blue" data-act="again">${ic('retry')} Start again</button>
      <button class="btn green" data-act="resume">${ic('play')} Keep going</button></div></div>`,
    { act: a => { if (a === 'map') App.go('map', { world: this.level.world }); else if (a === 'again') App.go('level', { id: this.level.id }); else App.closeModal(); },
      key: e => { if (e.key === 'Enter' || e.key === ' ') App.closeModal(); } });
  },

  finish() {
    const L = this.L, S = Store.get(), level = this.level, id = level.id;
    L.phase = 'done'; this.kb.clear(); this.capsWarn(false);
    this.flyer.classList.add('loop'); Sound.whoosh();

    const acc = L.first / L.total, pct = Math.floor(acc * 100);
    const wpm = Math.max(1, Math.round((L.total / 5) / (Math.max(L.activeMs, 2000) / 60000)));
    const stars = pct >= 98 ? 3 : pct >= 95 ? 2 : pct >= 90 ? 1 : 0;
    const rec = S.levels[id] || (S.levels[id] = { stars: 0, bestAcc: 0, bestWpm: 0, plays: 0 });
    const firstClear = stars > 0 && rec.stars === 0, worldWasDone = Store.worldDone(level.world);
    const newBest = stars > 0 && rec.stars > 0 && pct > rec.bestAcc;
    rec.plays++; rec.stars = Math.max(rec.stars, stars); rec.bestAcc = Math.max(rec.bestAcc, pct);
    if (stars) rec.bestWpm = Math.max(rec.bestWpm, wpm);

    const notes = [];
    let coins = 3;
    if (stars) {
      coins = Math.round(L.wordsTotal * 0.4) + stars * 5;
      if (firstClear) { coins += 10; notes.push('first time bonus'); }
      if (S.pet.hearts >= 5) { coins += Math.ceil(coins * 0.2); notes.push('happy dragon bonus'); }
    }
    const streakBonus = Store.touchStreak();
    if (streakBonus) { coins += streakBonus; notes.push(S.streak.count > 1 ? `${S.streak.count} day streak` : 'first flight today'); }
    Store.addCoins(coins);
    S.history.push({ t: Date.now(), id, acc: pct, wpm, secs: Math.round(L.activeMs / 1000), stars });
    if (S.history.length > 300) S.history.shift();
    S.totalSecs += Math.round(L.activeMs / 1000);

    const events = [];
    if (!worldWasDone && Store.worldDone(level.world)) {
      const w = WORLDS[level.world - 1];
      if (w.friend && !S.friends.includes(w.friend)) { S.friends.push(w.friend); events.push({ type: 'friend', friend: w.friend, world: w }); }
      if (level.world === 5) { S.owned['c-gold'] = true; events.push({ type: 'champion' }); }
    }
    if (Store.stage() > S.seenStage) { events.push({ type: 'grow', before: S.seenStage }); S.seenStage = Store.stage(); }
    Store.save();
    App.later(() => this.results({ pct, wpm, stars, coins, notes, newBest, events }), 1050);
  },

  results(r) {
    const L = this.L, level = this.level, next = LEVELS[this.idx + 1], pass = r.stars > 0;
    const speed = SPEED_NAMES.filter(([n]) => r.wpm >= n).pop()[1];
    const title = r.stars === 3 ? 'Perfect flight!' : r.stars === 2 ? 'Great flying!' : r.stars === 1 ? 'Nice work!' : 'So close!';
    const goNext = () => {
      const ev = r.events.shift();
      if (ev) { Celebrate[ev.type](ev, goNext); return; }
      if (!next) App.go('map', { world: 5 });
      else if (next.world !== level.world) App.go('map', { world: next.world });
      else App.go('level', { id: next.id });
    };
    const again = () => App.go('level', { id: level.id });
    const toMap = () => { const ev = r.events.shift(); if (ev) { Celebrate[ev.type](ev, toMap); return; } App.go('map', { world: level.world }); };
    const wrap = App.modal(`<div class="modal result"><h2>${title}${r.newBest ? '<span class="badge-new">New best!</span>' : ''}</h2>
      <div class="stars">${[0, 1, 2].map(i => `<div class="slot">${ic('starOff')}${i < r.stars ? ic('star', 'won') : ''}</div>`).join('')}</div>
      ${pass ? '' : `<p>You scored ${r.pct}%. You need 90% to earn a star.<br>Slow down and aim for the glowing key. You can do it!</p>`}
      <div class="stats">
        <div class="stat ${r.pct >= 90 ? 'good' : ''}"><b>${r.pct}%</b><span>accuracy</span></div>
        <div class="stat"><b>${r.wpm}</b><span>words a minute<br>${speed}</span></div>
        <div class="stat"><b>${L.best}</b><span>keys in a row</span></div>
        <div class="stat"><b>${L.gemsGot}</b><span>gems</span></div>
      </div>
      <div class="earn">${ic('coin')} +<span class="earn-n">0</span>${r.notes.length ? `<small>${esc(r.notes.join(', '))}</small>` : ''}</div>
      <div class="row">
        <button class="btn white" data-act="map">${ic('map')} Map</button>
        ${pass ? `<button class="btn blue" data-act="again">${ic('retry')} Again</button><button class="btn green big" data-act="next">${next ? 'Next' : 'Finish'} ${ic('next')}</button>`
          : `<button class="btn green big" data-act="again">${ic('retry')} Try again</button>`}
      </div></div>`,
    { act: a => { Sound.click(); if (a === 'next') goNext(); else if (a === 'again') again(); else toMap(); },
      key: e => { if (e.key === 'Enter') { Sound.click(); if (pass) goNext(); else again(); } } });

    if (pass) { Sound.fanfare(); FX.confetti(40 + r.stars * 40); } else Sound.almost();
    $$('.won', wrap).forEach((s, i) => App.later(() => {
      s.classList.add('in'); Sound.star(i);
      const p = App.pos(s); FX.burst(p.x, p.y, { n: 18, speed: 340, size: 9 });
    }, 450 + i * 420));
    App.later(() => {
      const e = $('.earn-n', wrap); if (!e) return;
      App.countTo(e, 0, r.coins, 800); Sound.coin();
      const p = App.pos($('.earn', wrap)); FX.burst(p.x, p.y, { n: 14, colors: ['#ffd23f', '#ffc928', '#fff7b0'], speed: 240 });
    }, 500 + r.stars * 420);
  },
});
