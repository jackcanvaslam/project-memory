:root {
  --text: #e9edff; --dim: #8f98c9; --line: rgba(150, 170, 255, .2); --panel: rgba(8, 11, 34, .84);
  --cyan: #22e1ff; --mag: #ff3df0; --violet: #8b5cff; --lime: #b6ff3d; --amber: #ffc23d; --red: #ff4d6d;
  --ui: 'Exo 2', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #03040c; }
body { font-family: var(--ui); color: var(--text); -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }
b, strong { font-weight: 700; }

#stage { --accent: 45, 230, 200; position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #050718; }
#bg, #fx { position: absolute; left: 0; top: 0; display: block; }
#fx { pointer-events: none; z-index: 50; }
#vig { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, rgba(0, 0, 10, 0) 38%, rgba(0, 0, 10, .55) 100%); }
#screens { position: absolute; inset: 0; z-index: 2; }
.screen { position: absolute; inset: 0; animation: scr-in .3s cubic-bezier(.2, .8, .3, 1) both; }
.screen.leaving { animation: scr-out .22s ease-in both; pointer-events: none; }
@keyframes scr-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes scr-out { to { opacity: 0; } }

/* ---------- buttons and panels ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 22px; border-radius: 10px;
  font-weight: 700; font-size: 15px; letter-spacing: .11em; text-transform: uppercase; white-space: nowrap; color: var(--text);
  background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .22); transition: transform .12s, background .15s, border-color .15s, box-shadow .15s; }
.btn .ic { font-size: 1.3em; }
.btn:hover { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .5); transform: translateY(-2px); }
.btn:active { transform: translateY(1px) scale(.98); }
.btn.primary, .btn.go, .btn.hot { border: 0; color: #040716; font-weight: 800; }
.btn.primary { background: linear-gradient(100deg, #22e1ff, #8b5cff); box-shadow: 0 0 26px rgba(34, 225, 255, .45); }
.btn.go { background: linear-gradient(100deg, #b6ff3d, #22e1ff); box-shadow: 0 0 26px rgba(120, 255, 160, .45); }
.btn.hot { background: linear-gradient(100deg, #ff3df0, #ff9a3d); box-shadow: 0 0 26px rgba(255, 61, 240, .4); }
.btn.primary:hover, .btn.go:hover, .btn.hot:hover { filter: brightness(1.12); box-shadow: 0 0 38px rgba(34, 225, 255, .65); }
.btn.big { height: 66px; padding: 0 44px; font-size: 21px; border-radius: 14px; }
.btn.small { height: 36px; padding: 0 14px; font-size: 12px; border-radius: 8px; }
.btn.icon { width: 44px; padding: 0; font-size: 17px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.22); } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .06); }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 10px; background: rgba(8, 11, 34, .78); border: 1px solid var(--line); font: 700 18px var(--mono); }
.chip .ic { font-size: 20px; } .chip small { font: 600 10px var(--ui); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; margin-right: 2px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: rgb(var(--accent)); }

.hud { position: absolute; left: 0; right: 0; top: 0; height: 68px; display: flex; align-items: center; gap: 12px; padding: 0 18px; z-index: 5; }
.hud-title { font-weight: 800; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.1; text-shadow: 0 2px 12px rgba(0, 0, 0, .7); }
.hud-title small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .22em; color: rgb(var(--accent)); margin-top: 3px; }
.hud-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* ---------- pop-ups ---------- */
.modal-wrap { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(2, 3, 12, .74); animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.modal { position: relative; background: rgba(9, 12, 38, .97); border: 1px solid rgba(var(--accent), .55); border-radius: 20px; padding: 30px 40px 32px; min-width: 460px; max-width: 1100px; text-align: center;
  box-shadow: 0 0 70px rgba(var(--accent), .2), 0 30px 80px rgba(0, 0, 0, .7); animation: pop .32s cubic-bezier(.2, 1.1, .3, 1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(18px); } }
.modal h2 { margin: 6px 0 6px; font-size: 34px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; }
.modal p { margin: 6px 0 12px; font-size: 17px; color: var(--dim); font-weight: 500; line-height: 1.45; }
.modal p b { color: var(--text); }
.modal .row { display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.modal .x { position: absolute; right: 14px; top: 14px; }
#toast { position: absolute; left: 50%; top: 84px; transform: translate(-50%, -20px); z-index: 60; padding: 12px 22px; border-radius: 10px; background: rgba(9, 12, 38, .96); border: 1px solid rgba(var(--accent), .7); color: #fff; font-size: 16px; font-weight: 600;
  opacity: 0; transition: transform .25s cubic-bezier(.2, 1.2, .4, 1), opacity .2s; pointer-events: none; white-space: nowrap; box-shadow: 0 0 30px rgba(var(--accent), .3); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
canvas.dv { display: block; }

/* ---------- title ---------- */
.scr-title { display: flex; flex-direction: column; align-items: center; }
.logo { margin-top: 96px; font-size: 104px; font-weight: 900; letter-spacing: .05em; line-height: 1; text-transform: uppercase; transform: skewX(-7deg);
  background: linear-gradient(100deg, #22e1ff 0%, #9d7bff 38%, #ff3df0 62%, #ffc23d 100%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 22px rgba(120, 140, 255, .55)); animation: sheen 7s ease-in-out infinite; }
@keyframes sheen { 0%, 100% { background-position: 0 0; } 50% { background-position: 100% 0; } }
.tagline { margin-top: 18px; font-size: 17px; font-weight: 600; letter-spacing: .42em; text-transform: uppercase; color: #cfd6ff; text-shadow: 0 2px 14px rgba(0, 0, 0, .8); }
.title-play { position: absolute; left: 0; right: 0; bottom: 84px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.title-hint { color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; }
.corner { position: absolute; right: 18px; top: 12px; display: flex; gap: 8px; z-index: 6; }

/* ---------- first run: hatching ---------- */
.scr-hatch { display: flex; flex-direction: column; align-items: center; }
.coach { margin-top: 22px; padding: 18px 34px; max-width: 980px; text-align: center; font-size: 21px; font-weight: 500; line-height: 1.45; }
.coach b { color: rgb(var(--accent)); }
.keycap { display: inline-grid; place-items: center; min-width: 36px; height: 36px; padding: 0 9px; margin: 0 3px; border-radius: 8px; background: var(--kc, var(--cyan)); color: #050818; font: 800 19px var(--mono); vertical-align: middle; box-shadow: 0 0 16px var(--kc, var(--cyan)); }
.hatch-egg { position: absolute; left: 50%; top: 176px; width: 196px; margin-left: -98px; }
.hatch-meter { position: absolute; left: 50%; top: 148px; transform: translateX(-50%); display: flex; gap: 6px; }
.hatch-meter i { width: 30px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .16); transition: background .2s, box-shadow .2s; }
.hatch-meter i.on { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
.name-form { margin-top: 22px; display: flex; gap: 12px; align-items: center; justify-content: center; }
input.text { font: 700 24px var(--ui); color: var(--text); width: 300px; height: 56px; padding: 0 18px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .06); text-align: center; -webkit-user-select: text; user-select: text; }
input.text::placeholder { color: rgba(200, 210, 255, .35); }
input.text:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 22px rgba(34, 225, 255, .35); }
.hatch-card { position: absolute; left: 50%; top: 440px; transform: translateX(-50%); padding: 26px 36px 30px; text-align: center; width: 720px; }
.hatch-card h2 { margin: 6px 0 0; font-size: 30px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.hatch-card p { margin: 10px 0 0; color: var(--dim); font-size: 18px; }
.kb-dock { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 12px 16px 10px; display: flex; gap: 10px; align-items: flex-end; }
.egg .crack { display: none; filter: drop-shadow(0 0 6px #9dfcff); }
.egg.k1 .c1, .egg.k2 .c1, .egg.k2 .c2, .egg.k3 .c1, .egg.k3 .c2, .egg.k3 .c3, .egg.k4 .crack { display: block; }
.egg-core { opacity: .25; transition: opacity .3s; animation: core 2.2s ease-in-out infinite; transform-origin: 110px 150px; }

  const MAXLINE = 28;
  const rnd = n => Math.floor(Math.random() * n);
  const pick = arr => arr[rnd(arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* Every key learned up to and including level index i */
  function keysUpTo(i) {
    let keys = '';
    for (let k = 0; k <= i && k < LEVELS.length; k++) keys += LEVELS[k].keys;
    if (i >= levelIndex('4-1')) keys += 'SHIFT';
    return keys;
  }
  function lettersUpTo(i) {
    return keysUpTo(Math.min(i, levelIndex('3-6'))).replace(/[^a-z]/g, '');
  }
  function wordPool(letters, minLen = 1, maxLen = 9) {
    const ok = new Set(letters);
    return WORD_SET.filter(w => w.length >= minLen && w.length <= maxLen && [...w].every(c => ok.has(c)));
  }

  function wrap(text, max = MAXLINE) {
    const out = []; let line = '';
    for (const w of text.split(' ')) {
      if (line && (line + ' ' + w).length > max) { out.push(line); line = w; }
      else line = line ? line + ' ' + w : w;
    }
    if (line) out.push(line);
    return out;
  }

  /* Pick words, favouring ones with the new keys and the keys she misses most */
  function weightedWords(pool, count, favour, weak) {
    const fav = new Set(favour);
    const scored = pool.map(w => {
      let s = 1;
      if ([...w].some(c => fav.has(c))) s += 3;
      for (const c of w) s += (weak[c] || 0) * 2;
      return { w, s };
    });
    const out = [];
    let guard = 0;
    while (out.length < count && guard++ < count * 30) {
      const total = scored.reduce((t, x) => t + x.s, 0);
      let r = Math.random() * total, chosen = scored[0];
      for (const x of scored) { r -= x.s; if (r <= 0) { chosen = x; break; } }
      if (out.length && out[out.length - 1] === chosen.w) continue;
      if (out.includes(chosen.w) && scored.length > count) continue;
      if (out.filter(x => x === chosen.w).length >= 2 && scored.length > 6) continue;
      out.push(chosen.w);
    }
    return out;
  }

    const lines = []; let line = '';
    for (const w of words) {
      if (lines.length >= lineCount) break;
      const next = line ? line + joiner + w : w;
      if (next.length > max) { lines.push(line); line = w; } else line = next;
    }
    if (line && lines.length < lineCount) lines.push(line);
    return lines;
  }

  function mixedGroups(newKeys, oldLetters, groups) {
    const letters = [...newKeys].filter(isLetter);
    const punct = [...newKeys].filter(c => !isLetter(c));
    const anchors = oldLetters.length ? [...oldLetters] : letters;
    const out = [];
    for (let g = 0; g < groups; g++) {
      const len = 2 + rnd(2);
      let s = '';
      const mustAt = rnd(len);
      for (let i = 0; i < len; i++) {
        let c = (i === mustAt || Math.random() < 0.35) ? pick(letters.length ? letters : anchors) : pick(anchors);
        if (s.length >= 2 && s[s.length - 1] === c && s[s.length - 2] === c) c = pick(anchors);
        s += c;
      }
      if (punct.length && Math.random() < 0.6) s += pick(punct);
      out.push(s);
    }
    return out.join(' ');
  }

  function decorate(words, p) {
    if (p === ';') return words.map(w => Math.random() < 0.5 ? w + ';' : w);
    if (p === ',') return words.map((w, i) => (i % 4 !== 3) ? w + ',' : w);
    if (p === '.') return words.map((w, i) => (i % 2 === 1) ? w + '.' : w);
    return words;
  }

  function keysLevel(level, idx, weak) {
    const [a, b] = [...level.keys];
    const old = lettersUpTo(idx - 1);
    const all = lettersUpTo(idx);
    const punct = [...level.keys].find(c => !isLetter(c));
    const lines = [
      `${a}${a}${a} ${b}${b}${b} ${a}${a} ${b}${b} ${a}${b}`,
      `${a}${b}${a} ${a}${a}${b} ${b}${a} ${a}${b}${b} ${a}${b}`,
    ];
    if (punct) lines[1] = `${a}${b} ${a}${a}${b} ${a}${b} f${b} j${b} ${a}${b}`;
    const newLetters = [...level.keys].filter(isLetter);
    const pool = wordPool(all, 2, level.world === 1 ? 6 : 7);
    const withNew = pool.filter(w => newLetters.some(c => w.includes(c)));
    lines.push(mixedGroups(level.keys, old, 5));
    if (withNew.length >= 8) {
      const count = level.world === 1 ? 3 : 4;
      let words = shuffle(weightedWords(withNew, 20, newLetters, weak).concat(weightedWords(pool, 10, [], weak)));
      words = words.filter((w, i) => i === 0 || w !== words[i - 1]);
      if (punct) words = decorate(words, punct);
      lines.push(...wordLines(words, count));
    } else {
      lines.push(mixedGroups(level.keys, old, 5));
      lines.push(mixedGroups(level.keys, old, 5));
    }
    if (level.extra) lines.push(...level.extra);
    return lines;
  }

  function reviewLevel(level, idx, weak) {
    const all = lettersUpTo(idx);
    const worldKeys = LEVELS.filter(l => l.world === level.world).map(l => l.keys).join('').replace(/[^a-z]/g, '');
    const pool = wordPool(all, 2, 7);
    let words = weightedWords(pool, 60, worldKeys, weak);
    if (level.world === 1) words = words.map(w => Math.random() < 0.2 ? w + ';' : w);
    const lines = wordLines(words, 7);
    if (level.world === 3) lines.splice(4, 3, 'a fox, a cat, and a zebra.', 'mix six eggs in a bowl.', 'the wizard can zap a box.');
    return lines;
  }

  function commonLevel() {
    return wordLines(shuffle(COMMON_WORDS), 8, ' ', 27);
  }

  function authoredLevel(level, names) {
    let src = level.lines.slice();
    if (level.pick) src = shuffle(src).slice(0, level.pick);
    const out = [];
    for (let s of src) {
      s = s.replace(/\{P\}/g, names.pet).replace(/\{K\}/g, names.kid);
      out.push(...wrap(s));
    }
    return out;
  }

  /* weak: map of key -> 0..1 "how often she misses it" ; names: {pet, kid} */
  function build(levelId, weak = {}, names = { pet: 'Ember', kid: 'Sam' }) {
    const idx = levelIndex(levelId);
    const level = LEVELS[idx];
    let lines;
    if (level.kind === 'keys') lines = keysLevel(level, idx, weak);
    else if (level.kind === 'review') lines = reviewLevel(level, idx, weak);
    else if (level.kind === 'common') lines = commonLevel();
    else lines = authoredLevel(level, names);
    return lines.map(l => l.trim()).filter(Boolean);
  }

  /* Words for the mini-game: anything she can already type */
  function miniWords(highestIdx) {
    const pool = wordPool(lettersUpTo(highestIdx), 2, 7);
    return pool.length >= 12 ? pool : wordPool('asdfghjkl', 2, 6);
  }

  return { build, keysUpTo, lettersUpTo, levelIndex, wordPool, miniWords, wrap, shuffle, pick, rnd };
})();

/* ---- state.js ---- */
/* Dragon Keys - saved progress (kept in this browser only) */
'use strict';

const Store = (() => {
  const KEY = 'dragon-keys-save-v1';
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);

  const fresh = () => ({
    v: 1, kid: '', hatched: false,
    pet: { name: '', color: 'emerald', trail: 'spark', crest: 'horns' },
    coins: 0, levels: {}, owned: {}, seenStage: 0,
    keys: {}, history: [], streak: { count: 0, last: '' }, totalSecs: 0,
    settings: { sound: true, music: true, unlockAll: false }, mini: { best: 0, plays: 0 },
  });

  let S = fresh();
  let memoryOnly = false;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) S = Object.assign(fresh(), JSON.parse(raw));
      S.pet = Object.assign(fresh().pet, S.pet);
      S.settings = Object.assign(fresh().settings, S.settings);
      S.mini = Object.assign(fresh().mini, S.mini);
    } catch (e) { memoryOnly = true; }
    // tidy up saves from the first version of the game
    if (!DRAGON_COLORS[S.pet.color]) S.pet.color = 'emerald';
    if (!TRAILS[S.pet.trail]) S.pet.trail = 'spark';
    if (!CRESTS[S.pet.crest]) S.pet.crest = 'horns';
    delete S.pet.wear; delete S.pet.hearts; delete S.pet.lastCare; delete S.food; delete S.friends;
    grantRewards();
    return S;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memoryOnly = true; }
  }
  function reset() { S = fresh(); save(); return S; }

  /* what she owns: skins, trails and crests */
  const ownKey = (kind, id) => ({ skin: 'c-', trail: 't-', crest: 'h-' })[kind] + id;
  const priceOf = (kind, id) => ({ skin: DRAGON_COLORS, trail: TRAILS, crest: CRESTS })[kind][id].price;
  const owns = (kind, id) => priceOf(kind, id) === 0 || !!S.owned[ownKey(kind, id)];
  const give = (kind, id) => { S.owned[ownKey(kind, id)] = true; };
  /* finishing a world wins its reward, including for saves made before rewards existed */
  function grantRewards() {
    const won = [];
    for (const w of WORLDS) if (worldDone(w.id) && !owns(w.reward.kind, w.reward.id)) { give(w.reward.kind, w.reward.id); won.push(w); }
    return won;
  }

  const get = () => S;
  const totalStars = () => Object.values(S.levels).reduce((t, l) => t + (l.stars || 0), 0);
  const stage = () => { const s = totalStars(); let st = 0; GROW_AT.forEach((n, i) => { if (s >= n) st = i; }); return st; };
  const levelStars = id => (S.levels[id] && S.levels[id].stars) || 0;
  const worldLevels = w => LEVELS.filter(l => l.world === w);
  const worldDone = w => worldLevels(w).every(l => levelStars(l.id) > 0);
  const worldOpen = w => w === 1 || S.settings.unlockAll || worldDone(w - 1);
  function levelOpen(id) {
    if (S.settings.unlockAll) return true;
    const i = LEVELS.findIndex(l => l.id === id);
    return i === 0 || levelStars(LEVELS[i - 1].id) > 0;
  }
  function nextLevel() {
    const l = LEVELS.find(l => levelStars(l.id) === 0);
    return l || LEVELS[LEVELS.length - 1];
  }
  function highestIndex() {
    let hi = 0;
    LEVELS.forEach((l, i) => { if (levelStars(l.id) > 0) hi = i; });
    return hi;
  }

  /* How often each key is missed, 0..1, only counted once there is enough data */
  function weakKeys() {
    const out = {};
    for (const k in S.keys) {
      const { hit = 0, miss = 0 } = S.keys[k];
      if (hit + miss >= 8) out[k] = Math.min(1, (miss / (hit + miss)) * 3);
    }
    return out;
  }
  function noteKey(ch, ok) {
    const k = ch.toLowerCase();
    const rec = S.keys[k] || (S.keys[k] = { hit: 0, miss: 0 });
    if (ok) rec.hit++; else rec.miss++;
    // Let old mistakes fade so the chart shows how she types now
    if (rec.hit + rec.miss > 200) { rec.hit = Math.round(rec.hit * 0.7); rec.miss = Math.round(rec.miss * 0.7); }
  }

  /* Returns the daily streak bonus if this is the first finished level today, else 0 */
  function touchStreak() {
    const t = today();
    if (S.streak.last === t) return 0;
    S.streak.count = (S.streak.last && dayDiff(S.streak.last, t) === 1) ? S.streak.count + 1 : 1;
    S.streak.last = t;
    return Math.min(S.streak.count, 7) * 2;
  }

  function addCoins(n) { S.coins = Math.max(0, S.coins + n); }

  return { load, save, reset, get, totalStars, stage, levelStars, worldLevels, worldDone, worldOpen, levelOpen,
    nextLevel, highestIndex, weakKeys, noteKey, touchStreak, addCoins, today, owns, give, ownKey, priceOf, grantRewards, isMemoryOnly: () => memoryOnly };
})();

/* Small live dragons inside the page (shop preview, pop-ups). Any <canvas class="dv"> gets one. */
const DragonViews = {
  list: document.getElementsByClassName('dv'),
  look(el) {
    const S = Store.get(), d = el.dataset;
    return { color: d.color || S.pet.color, stage: d.stage != null ? +d.stage : Store.stage(), trail: d.trail || S.pet.trail, crest: d.crest || S.pet.crest };
  },
  tick(dt) {
    for (const el of this.list) {
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h) continue;
      const k = Math.min(2, (window.devicePixelRatio || 1) * App.scale);
      if (!el._d) { el.width = Math.round(w * k); el.height = Math.round(h * k); el._d = new Dragon(this.look(el)); el._d.place(w * 0.74, h * 0.45); el._look = ''; }
      const key = JSON.stringify(el.dataset);
      if (key !== el._look) { el._look = key; el._d.setLook(this.look(el)); }
      const d = el._d, z = +el.dataset.zoom || 1, ctx = el.getContext('2d');
      const cx = w / z * 0.74, cy = h / z * 0.45;
      d.boost = 0.6;
      d.update(dt, cx + Math.sin(d.t * 0.9) * 10, cy + Math.sin(d.t * 1.7) * h / z * 0.1, 90);
      ctx.setTransform(k * z, 0, 0, k * z, 0, 0); ctx.clearRect(0, 0, w / z, h / z);
      d.draw(ctx);
    }
  },
};

/* ---- keyboard.js ---- */
/* Dragon Keys - the on-screen keyboard and the two guide hands */
'use strict';

const Keyboard = (() => {
  const SPECIAL_FINGER = { Tab: 'L1', CapsLock: 'L1', ShiftLeft: 'L1', Backspace: 'R1', Enter: 'R1', ShiftRight: 'R1', ' ': 'T' };
  const fingerOf = k => SPECIAL_FINGER[k] || KEY_FINGER[k] || 'R1';
  const FINGER_LABEL = { 1: 'pinky', 2: 'ring finger', 3: 'middle finger', 4: 'index finger' };

  function markup() {
    const rows = KEY_ROWS.map((row, r) => {
      const keys = row.map(([label, w, id], i) => {
        const k = id || label, f = fingerOf(k), wide = label.length > 1;
        let style = `--kc:${Art.FINGER_COLORS[f]}`;
        if (k === ' ') style += ';flex:none;width:352px';
        else if (wide && i === 0) style += `;flex:none;width:${Math.round(w * 50 + (w - 1) * 5)}px`;
        const cls = ['key', wide ? 'wide' : '', (k === 'f' || k === 'j') ? 'bump' : ''].join(' ');
        return `<div class="${cls}" data-k="${k === '"' ? '&quot;' : k === '\\' ? '\\' : k}" style="${style}">${label === '\\' ? '\\' : label}</div>`;
      }).join('');
      return `<div class="kb-row ${r === 0 ? 'num' : r === 4 ? 'sp' : ''}">${keys}</div>`;
    }).join('');
    const hand = side => `<div class="hand-box"><div class="finger-hint hint-${side}"></div>${Art.hand(side)}</div>`;
    return `${hand('left')}<div class="kb">${rows}</div>${hand('right')}`;
  }

  /* What it takes to type a character: which key, and whether Shift is needed */
  function plan(ch) {
    let base = ch, shift = false;
    if (SHIFTED[ch]) { base = SHIFTED[ch]; shift = true; }
    else if (ch.length === 1 && ch !== ch.toLowerCase()) { base = ch.toLowerCase(); shift = true; }
    const finger = fingerOf(base);
    const shiftKey = shift ? (finger[0] === 'L' ? 'ShiftRight' : 'ShiftLeft') : null;
    return { base, shift, finger, shiftKey, shiftFinger: shiftKey ? SPECIAL_FINGER[shiftKey] : null };
  }
  function fingerName(f) {
    if (f === 'T') return 'thumb';
    return (f[0] === 'L' ? 'left ' : 'right ') + FINGER_LABEL[f[1]];
  }

  function create(root) {
    const keyEls = {};
    root.querySelectorAll('.key').forEach(el => { keyEls[el.dataset.k] = el; });
    const hints = { L: root.querySelector('.hint-left'), R: root.querySelector('.hint-right') };
    let targets = [];

    function clear() {
      targets.forEach(el => el.classList.remove('target'));
      targets = [];
      root.querySelectorAll('.fg.use').forEach(el => el.classList.remove('use'));
      Object.values(hints).forEach(h => h && h.classList.remove('show'));
    }
    function useFinger(f, text) {
      const sel = f === 'T' ? '.fg-T' : '.fg-' + f;
      root.querySelectorAll(sel).forEach(el => { el.classList.add('use'); el.style.setProperty('--fc', Art.FINGER_COLORS[f]); });
      const sides = f === 'T' ? ['L', 'R'] : [f[0]];
      sides.forEach(s => { const h = hints[s]; if (h) { h.textContent = text; h.style.setProperty('--fc', Art.FINGER_COLORS[f]); h.classList.add('show'); } });
    }
    function target(ch) {
      clear();
      if (ch == null) return;
      const p = plan(ch);
      const el = keyEls[p.base];
      if (el) { el.classList.add('target'); targets.push(el); }
      useFinger(p.finger, p.finger === 'T' ? 'thumb' : FINGER_LABEL[p.finger[1]]);
      if (p.shiftKey) {
        const s = keyEls[p.shiftKey];
        if (s) { s.classList.add('target'); targets.push(s); }
        useFinger(p.shiftFinger, 'pinky on Shift');
      }
    }
    function setLearned(keys) {
      const known = keys == null ? null : new Set(keys);
      const shift = keys == null || keys.includes('SHIFT');
      for (const k in keyEls) {
        let on;
        if (k === ' ') on = true;
        else if (k === 'ShiftLeft' || k === 'ShiftRight') on = shift;
        else if (k.length > 1) on = false;
        else on = known ? known.has(k) : !/[0-9`\-=\[\]\\]/.test(k);
        keyEls[k].classList.toggle('off', !on);
      }
    }
    function press(e, ok) {
      let k = e.code === 'ShiftLeft' || e.code === 'ShiftRight' ? e.code : e.key;
      if (k.length === 1) k = SHIFTED[k] || k.toLowerCase();
      const el = keyEls[k];
      if (!el) return;
      const cls = ok == null ? ['down'] : ['down', ok ? 'ok' : 'bad'];
      el.classList.add(...cls);
      setTimeout(() => el.classList.remove(...cls), 150);
    }
    return { target, clear, setLearned, press, keyEls };
  }

  return { markup, create, plan, fingerName, fingerOf };
})();

/* ---- ui.js ---- */
/* Dragon Keys - the app shell: sizing, screens, pop-ups, shared bits of UI */
'use strict';

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = Art.ic;
const cleanName = (s, fallback) => (String(s || '').replace(/[^A-Za-z]/g, '').slice(0, 10).replace(/^./, c => c.toUpperCase())) || fallback;

const App = (() => {
  let stage, screensEl, toastEl, current = null, currentName = '', W = 1280, scale = 1, last = 0;
  let modalEl = null, modalKey = null, modalClose = null, toastTimer = 0;
  const screens = {};
  const timers = new Set();

  function register(name, def) { screens[name] = def; }

  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / 1280, vh / 720);
    W = Math.round(clamp(vw / scale, 1280, 1680));
    stage.style.width = W + 'px';
    stage.style.transform = `translate(${-W * scale / 2}px, ${-360 * scale}px) scale(${scale})`;
    Scene.resize(W, 720, scale); FX.resize(W, 720, scale);
  }

  /* timers that are cancelled automatically when the screen changes */
  function later(fn, ms) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; }
  function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

  function go(name, params = {}) {
    if (current && current.exit) current.exit();
    clearTimers();
    closeModal(true);
    FX.clear();
    Scene.gems.length = 0; Scene.onDraw = null; Scene.setHeat(0);
    const old = screensEl.lastElementChild;
    const el = document.createElement('div');
    el.className = 'screen scr-' + name;
    screensEl.appendChild(el);
    if (old) { old.classList.add('leaving'); setTimeout(() => old.remove(), 230); }
    current = screens[name]; currentName = name;
    current.el = el;
    current.enter(el, params);
  }

  function modal(html, opts = {}) {
    closeModal(true);
    modalEl = document.createElement('div');
    modalEl.className = 'modal-wrap';
    modalEl.innerHTML = html;
    modalKey = opts.key || null; modalClose = opts.onClose || null;
    stage.appendChild(modalEl);
    modalEl.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (b && opts.act) { opts.act(b.dataset.act, b, e); return; }
      if (e.target === modalEl && opts.dismiss) closeModal();
    });
    return modalEl;
  }
  function closeModal(silent) {
    if (!modalEl) return;
    const cb = modalClose;
    modalEl.remove(); modalEl = null; modalKey = null; modalClose = null;
    if (cb && !silent) cb();
  }

  function toast(msg, ms = 2600) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  /* position of an element in stage coordinates (ax, ay pick a point inside it) */
  function pos(el, ax = 0.5, ay = 0.5) {
    const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x: (r.left + r.width * ax - s.left) / scale, y: (r.top + r.height * ay - s.top) / scale };
  }

  /* a live picture of the dragon for use inside the page. over can set stage, color, trail, crest, zoom. */
  function dv(over = {}) {
    return `<canvas class="dv" ${Object.entries(over).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}></canvas>`;
  }
  /* the dragon as she has set it up, for drawing on the main canvas */
  function myDragon(over = {}) {
    const S = Store.get();
    return new Dragon(Object.assign({ color: S.pet.color, stage: Store.stage(), trail: S.pet.trail, crest: S.pet.crest }, over));
  }

  const sysButtons = () => {
    const s = Store.get().settings;
    return `<button class="btn icon" data-g="music" aria-label="Music" title="Music">${ic(s.music ? 'music' : 'musicOff')}</button>
        <button class="btn icon" data-g="sound" aria-label="Sound effects" title="Sound effects">${ic(s.sound ? 'soundOn' : 'soundOff')}</button>
        <button class="btn icon" data-g="full" aria-label="Full screen" title="Full screen">${ic('full')}</button>`;
  };

  function hud({ back = false, title = '', sub = '' } = {}) {
    const S = Store.get();
    return `<div class="hud">
      ${back ? `<button class="btn icon" data-act="back" aria-label="Back">${ic('back')}</button>` : ''}
      <div class="hud-title">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
      <div class="hud-right">
        ${S.streak.count > 1 ? `<div class="chip" title="Days in a row">${ic('flame')}${S.streak.count}</div>` : ''}
        <div class="chip" title="Stars">${ic('star')}<span class="star-count">${Store.totalStars()}</span></div>
        <div class="chip" title="Shards">${ic('shard')}<span class="coin-count">${S.coins}</span></div>
        ${sysButtons()}
      </div></div>`;
  }

  function countTo(el, from, to, ms = 700) {
    if (!el) return;
    const t0 = performance.now();
    const step = now => {
      const u = Math.min(1, (now - t0) / ms);
      el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - u, 3)));

  }
  function refreshCoins(from) {
    const S = Store.get();
    $$('.coin-count').forEach(el => { if (from == null) el.textContent = S.coins; else countTo(el, from, S.coins); });
    $$('.star-count').forEach(el => { el.textContent = Store.totalStars(); });
  }

  function onKey(e) {
    Sound.unlock();
    const inField = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    if (!inField && (e.key === ' ' || e.key === "'" || e.key === '/' || e.key === 'Backspace' || e.key === 'Tab')) e.preventDefault();
    if (e.repeat) return;
    if (modalEl) {
      if (e.key === 'Escape' && modalEl.querySelector('.x')) { closeModal(); return; }
      if (modalKey) modalKey(e);
      return;
    }
    if (inField && e.key !== 'Enter') return;
    if (current && current.key) current.key(e);
  }

  function onGlobalClick(e) {
    Sound.unlock();
    // keep keyboard focus off buttons so Space and Enter never press one by accident while typing
    const a = document.activeElement;
    if (a && a.tagName === 'BUTTON') a.blur();
    const g = e.target.closest('[data-g]');
    if (!g) return;
    const S = Store.get();
    if (g.dataset.g === 'sound') {
      S.settings.sound = !S.settings.sound; Sound.setOn(S.settings.sound); Store.save();
      $$('[data-g="sound"]').forEach(b => { b.innerHTML = ic(S.settings.sound ? 'soundOn' : 'soundOff'); });
      Sound.click();
    } else if (g.dataset.g === 'music') {
      S.settings.music = !S.settings.music; Sound.setMusic(S.settings.music); Store.save();
      $$('[data-g="music"]').forEach(b => { b.innerHTML = ic(S.settings.music ? 'music' : 'musicOff'); });
      Sound.click();
    } else if (g.dataset.g === 'full') {
      const d = document;
      if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen(); }
      else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
    }
  }

  function frame(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if (current && current.tick) current.tick(dt);
    if (!current || !current.noScene) { Scene.update(dt); Scene.draw(); }
    DragonViews.tick(dt);
    FX.update(dt); FX.draw();
    requestAnimationFrame(frame);
  }

  function start() {
    stage = $('#stage'); screensEl = $('#screens'); toastEl = $('#toast');
    Scene.init($('#bg')); FX.init($('#fx'));
    const S = Store.load();
    Sound.setOn(S.settings.sound); Sound.setMusic(S.settings.music);
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('keydown', onKey);
    stage.addEventListener('click', onGlobalClick);
    go('title');
    requestAnimationFrame(frame);
  }

  return { register, go, modal, closeModal, toast, pos, dv, myDragon, hud, sysButtons, countTo, refreshCoins, later, start,
    get W() { return W; }, get scale() { return scale; }, get screen() { return currentName; }, get hasModal() { return !!modalEl; } };
})();

/* ---- screens.js ---- */
/* Dragon Keys - title screen, hatching the egg, the lair and the forge */
'use strict';

/* ---------------- Title ---------------- */
App.register('title', {
  enter(el) {
    const S = Store.get();

        <div class="name-form"><input class="text" maxlength="10" placeholder="Dragon name" autocomplete="off" spellcheck="false">
          <button class="btn icon" data-act="dice" title="Pick a name for me" style="height:56px;width:56px">${ic('retry')}</button>
          <button class="btn primary" data-act="done">Let's fly ${ic('next')}</button></div>`;

  },
  tick(dt) {

  },
});

/* ---------------- The forge: skins, trails and crests ---------------- */
const Forge = (() => {
  const TABS = [['skin', 'Skins'], ['trail', 'Trails'], ['crest', 'Crests']];
  const TABLE = { skin: DRAGON_COLORS, trail: TRAILS, crest: CRESTS };
  const FIELD = { skin: 'color', trail: 'trail', crest: 'crest' };
  let tab = 'skin', sel = null, done = null;

  function open(onClose) { done = onClose; sel = null; draw(); }
  const equipped = (kind, id) => Store.get().pet[FIELD[kind]] === id;
  function lockText(kind, id) {
    const it = TABLE[kind][id];
    if (kind === 'skin') return 'Finish Dragon Summit';
    return 'Finish ' + WORLDS[it.world - 1].name;
  }
  function draw() {
    const S = Store.get();
    if (!sel || sel.kind !== tab) sel = { kind: tab, id: S.pet[FIELD[tab]] };
    const it = TABLE[tab][sel.id], own = Store.owns(tab, sel.id), on = equipped(tab, sel.id);
    const look = { color: S.pet.color, trail: S.pet.trail, crest: S.pet.crest, zoom: [1.5, 1.25, 1.05, 0.9][Store.stage()] };
    look[FIELD[tab]] = sel.id;
    const action = on ? `${ic('check')} Equipped`
      : own ? `<button class="btn primary" data-act="equip">Equip</button>`
      : it.price < 0 ? `${ic('lock')} ${lockText(tab, sel.id)}`
      : `<button class="btn primary" data-act="buy">${ic('shard')} Buy for ${it.price}</button>`;
    const goods = Object.entries(TABLE[tab]).map(([id, x]) => {
      const o = Store.owns(tab, id), e = equipped(tab, id);
      const state = e ? `${ic('check')} Equipped` : o ? 'Owned' : x.price < 0 ? `${ic('lock')} ${lockText(tab, id)}` : `${ic('shard')} ${x.price}`;
      return `<button class="good ${e ? 'on' : ''} ${sel.id === id ? 'sel' : ''}" data-act="pick" data-id="${id}">${Art.swatch(tab, id)}<b>${x.name}</b><small>${state}</small></button>`;
    }).join('');
    App.modal(`<div class="modal forge"><button class="btn icon x" data-act="close" aria-label="Close">${ic('close')}</button>
      <div class="forge-view">${App.dv(look)}
        <div class="info"><div class="kicker">${tab}</div><h3>${it.name}</h3><div class="act">${action}</div></div></div>
      <div class="forge-main"><div class="tabs">${TABS.map(([id, name]) => `<button class="tab ${id === tab ? 'on' : ''}" data-act="tab" data-id="${id}">${name}</button>`).join('')}
          <div class="chip">${ic('shard')}<span class="coin-count">${S.coins}</span></div></div>
        <div class="goods">${goods}</div></div></div>`,
    { act, onClose: () => { if (done) done(); }, dismiss: true });
  }
  function act(a, b) {
    const S = Store.get();
    if (a === 'close') { Sound.click(); App.closeModal(); return; }
    if (a === 'tab') { tab = b.dataset.id; sel = null; Sound.pop(); draw(); return; }
    if (a === 'pick') { sel = { kind: tab, id: b.dataset.id }; Sound.pop(); draw(); return; }
    if (a === 'equip') { S.pet[FIELD[tab]] = sel.id; Store.save(); Sound.equip(); draw(); return; }
    if (a === 'buy') {
      const cost = TABLE[tab][sel.id].price;
      if (S.coins < cost) { Sound.nope(); App.toast(`You need ${cost - S.coins} more shards. Fly a level to collect some.`); return; }
      const before = S.coins, p = App.pos(b);
      Store.addCoins(-cost); Store.give(tab, sel.id); S.pet[FIELD[tab]] = sel.id; Store.save();
      Sound.buy();
      draw();
      FX.burst(p.x, p.y, { n: 18, colors: ['#22e1ff', '#ffffff', '#ff3df0'] });
      App.refreshCoins(before);
    }
  }
  return { open };
})();

'use strict';

App.register('map', {
  enter(el, params = {}) {
    const next = Store.nextLevel();

    this.t = 0;
    Scene.setHorizon(0); Scene.setSpeed(14);
