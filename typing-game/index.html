    this.d = App.myDragon({ size: [1.25, 1.1, 1, 0.95][Store.stage()] }); this.d.place(App.W / 2, 300);
    Scene.onDraw = ctx => this.d.draw(ctx);
    this.render();
    if (params.open) this.card(params.open);
  },
  spots(n) {
    return n === 6
      ? [[170, 505], [372, 395], [574, 505], [776, 390], [968, 495], [1128, 375]]
      : [[230, 490], [490, 382], [770, 490], [1040, 376]];
  },
  render() {
    const el = this.el, w = WORLDS[this.world - 1], open = Store.worldOpen(this.world);
    Scene.setTheme(w.theme);
    Sound.music(w.theme); Sound.setEnergy(0.3);
    const levels = Store.worldLevels(this.world), pts = this.spots(levels.length), next = Store.nextLevel();
    const got = levels.reduce((t, l) => t + Store.levelStars(l.id), 0);
    // a smooth glowing trail through the level spots
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += `C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
    }
    this.orbit = null;
    const nodes = levels.map((l, i) => {
      const stars = Store.levelStars(l.id), unlocked = Store.levelOpen(l.id) && open, isNext = l.id === next.id && stars === 0 && unlocked;
      if (isNext) this.orbit = pts[i];
      const cls = ['node', stars ? 'done' : '', !unlocked ? 'locked' : '', isNext ? 'next' : ''].join(' ');
      const face = !unlocked ? ic('lock') : l.kind === 'review' ? ic('bolt') : String(i + 1).padStart(2, '0');
      const label = l.kind === 'review' ? 'Final run' : l.title;
      return `<button class="${cls}" style="left:${pts[i][0]}px;top:${pts[i][1]}px" data-act="level" data-id="${l.id}" ${unlocked ? '' : 'tabindex="-1"'}>
        <span class="node-dot">${face}</span>
        <span class="node-stars">${[0, 1, 2].map(s => ic(s < stars ? 'star' : 'starOff')).join('')}</span>
        <span class="node-label">${esc(label)}</span></button>`;
    }).join('');
    if (!this.orbit && open) { const i = levels.findIndex(l => l.id === next.id); this.orbit = pts[i >= 0 ? i : pts.length - 1]; }
    el.innerHTML = `${App.hud({ back: true, title: 'World map' })}
      <div class="map-banner panel"><div class="kicker">World ${w.id} · ${w.skill}</div><h2>${w.name}</h2><p>${ic('star')} ${got} of ${levels.length * 3}</p></div>
      <div class="map-area">
        ${open ? `<svg class="path" viewBox="0 0 1280 720">
          <path d="${d}" fill="none" stroke="rgba(${Scene.ACCENT[w.theme]},.25)" stroke-width="10" stroke-linecap="round"/>
          <path class="flow" d="${d}" fill="none" stroke="rgb(${Scene.ACCENT[w.theme]})" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 14"/></svg>${nodes}`
        : `<div class="map-lock panel" style="position:absolute">${ic('lock')}<h3>${w.name} is locked</h3><p>Finish every level in ${WORLDS[this.world - 2].name} to open it.</p></div>`}
      </div>
      ${this.world > 1 ? `<button class="btn icon map-arrow l" data-act="prev" aria-label="Previous world">${ic('back')}</button>` : ''}
      ${this.world < WORLDS.length ? `<button class="btn icon map-arrow r" data-act="nextw" aria-label="Next world">${ic('next')}</button>` : ''}
      <div class="map-dots">${WORLDS.map(x => `<button class="${x.id === this.world ? 'on' : ''}" data-act="world" data-id="${x.id}" aria-label="World ${x.id}">${Store.worldOpen(x.id) ? '0' + x.id : ic('lock')}</button>`).join('')}</div>`;
  },
  tick(dt) {
    this.t += dt;
    const off = (App.W - 1280) / 2, o = this.orbit, t = this.t;
    this.d.boost = 1.2;
    // the dragon circles the level she is up to
    if (o) this.d.update(dt, o[0] + off + Math.cos(t * 1.25) * 120, o[1] - 10 + Math.sin(t * 1.25) * 84, 0, 24, 7);
    else this.d.update(dt, App.W / 2 + Math.sin(t * 0.5) * 300, 250 + Math.sin(t * 1.1) * 70, 0, 20, 7);
  },
  act(a, b) {
    if (a === 'back') { Sound.click(); App.go('den'); }
    else if (a === 'prev') { this.world--; Sound.whoosh(); this.render(); }
    else if (a === 'nextw') { this.world++; Sound.whoosh(); this.render(); }
    else if (a === 'world') { this.world = +b.dataset.id; Sound.whoosh(); this.render(); }
    else if (a === 'level') { Sound.pop(); this.card(b.dataset.id); }
  },
  card(id) {
    const l = LEVELS.find(x => x.id === id), rec = Store.get().levels[id];
    if (!l || !Store.levelOpen(id)) return;
    const n = Store.worldLevels(l.world).indexOf(l) + 1;
    const start = () => { Sound.click(); App.go('level', { id }); };
    App.modal(`<div class="modal lv-card"><button class="btn icon x" data-act="close" aria-label="Close">${ic('close')}</button>
      <div class="kicker">World ${l.world} · Level ${n}</div><h2>${esc(l.title)}</h2>
      ${LevelInfo.html(l)}
      ${rec && rec.plays ? `<div class="best">${[0, 1, 2].map(s => ic(s < (rec.stars || 0) ? 'star' : 'starOff')).join('')} best ${rec.bestAcc || 0}% · ${rec.bestWpm || 0} wpm</div>` : ''}
      <div class="row"><button class="btn primary big" data-act="start">${ic('play')} Start</button></div></div>`,
    { dismiss: true, act: a => { if (a === 'start') start(); else App.closeModal(); }, key: e => { if (e.key === 'Enter' || e.key === ' ') start(); } });
  },
  key(e) {
    if (e.key === 'ArrowLeft' && this.world > 1) this.act('prev');
    else if (e.key === 'ArrowRight' && this.world < WORLDS.length) this.act('nextw');
    else if (e.key === 'Enter') { const n = Store.nextLevel(); if (n.world === this.world && Store.worldOpen(this.world)) this.card(n.id); }
    else if (e.key === 'Escape') this.act('back');
  },
});

/* What a level teaches, shown on the map card and at the start of the level */
const LevelInfo = {
  html(l) {
    if (l.kind === 'keys') {
      const caps = [...l.keys].map(k => {
        const f = Keyboard.fingerOf(k);
        return `<div><span class="keycap" style="--kc:${Art.FINGER_COLORS[f]}">${esc(k.toUpperCase())}</span>${Keyboard.fingerName(f)}</div>`;
      }).join('');
      return `<p>Two new keys</p><div class="keys">${caps}</div>`;
    }
    if (l.intro) return `<p>${esc(l.intro)}</p>`;
    if (l.kind === 'review') return '<p>The final run for this world. Every key you have learned, mixed together.</p>';
    if (l.kind === 'common') return '<p>The words people type most often. Get them into your fingers.</p>';
    if (l.id === '4-4') return '<p>Capitals, commas and question marks, all together in real sentences.</p>';
    if (l.id === '5-5' || l.id === '5-6') return '<p>Type the story to find out what happens.</p>';
    return '<p>Real sentences. Eyes on the screen and let your fingers find the keys.</p>';
  },
};

/* ---- level.js ---- */
/* Dragon Keys - a typing level: the dragon flies, each finished word collects a shard,
   and a clean streak builds "flow", which drives the music and the glow. */
'use strict';

App.register('level', {
  GAP: 250,                      // distance between shards, in pixels
  CH: 29,                        // width of one character in the typing line
  MILESTONES: [10, 25, 50, 75, 100, 150, 200, 300],

  enter(el, { id }) {
    const S = Store.get();
    const idx = Content.levelIndex(id), level = LEVELS[idx], world = WORLDS[level.world - 1];
    this.level = level; this.idx = idx; this.t = 0; this.doneT = 0; this.calm = false;
    Scene.setTheme(world.theme); Scene.setHorizon(-250); Scene.setSpeed(40);
    Sound.music(world.theme); Sound.setEnergy(0.1);

    const lines = Content.build(id, Store.weakKeys(), { pet: S.pet.name, kid: S.kid });
    this.wordEnds = lines.map(line => { const ends = []; for (let i = 0; i < line.length; i++) if (line[i] === ' ') ends.push(i + 1); ends.push(line.length); return ends; });
    const wordsTotal = this.wordEnds.reduce((t, e) => t + e.length, 0);
    const hues = { meadow: [170, 300, 60, 200], peaks: [190, 50, 320, 130], cave: [50, 185, 320, 95], castle: [45, 190, 330, 130], summit: [130, 190, 50, 320] }[world.theme];
    this.gemList = Array.from({ length: wordsTotal }, (_, i) => ({ D: (i + 1) * this.GAP, y: 196 + Math.sin(i * 1.9) * 44, hue: hues[i % hues.length] }));
    this.L = { lines, li: 0, pos: 0, wi: 0, err: false, total: lines.reduce((t, l) => t + l.length, 0), done: 0, first: 0, errors: 0,
      streak: 0, best: 0, activeMs: 0, lastT: 0, phase: 'intro', gemsGot: 0, wordsDone: 0, wordsTotal, note: 0, kps: 0, d: 0, heat: 0, idle: 0 };

    const n = Store.worldLevels(level.world).indexOf(level) + 1;
    el.innerHTML = `<div class="edge"></div><div class="lv-progress"><i></i></div>
      <div class="lv-top">
        <button class="btn icon" data-act="pause" aria-label="Pause">${ic('pause')}</button>
        <div class="hud-title">${esc(level.title)}<small>World ${level.world} · Level ${n}</small></div>
        <div style="flex:1"></div>
        <div class="chip acc" title="Accuracy"><small>acc</small><span>100%</span></div>
        <div class="chip streak" title="Right keys in a row">${ic('flame')}<span>0</span></div>
        <div class="chip gems" title="Shards">${ic('shard')}<span>0</span></div>
        ${App.sysButtons()}
      </div>
      <div class="flow"><span>Flow</span><div><i></i></div></div>
      <div class="lv-col">
        <div class="prompt panel"><div class="next-line"></div></div>
        <div class="kb-panel panel">${Keyboard.markup()}</div>
      </div>
      <div class="lv-banner"><div class="kicker">World ${level.world} · Level ${n}</div><h2>${esc(level.title)}</h2>${LevelInfo.html(level)}
        <p>${level.world === 1 ? 'Rest your fingers on <b>A S D F</b> and <b>J K L ;</b> and keep your eyes on the screen.' : 'Stars are for accuracy, not speed. A clean streak builds the music.'}</p>
        <div class="go">Press <span class="keycap">SPACE</span> to start</div></div>`;
    this.prompt = $('.prompt', el); this.nextEl = $('.next-line', el); this.flowEl = $('.flow i', el);
    this.kb = Keyboard.create(el);
    this.kb.setLearned(Content.keysUpTo(idx));
    el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && b.dataset.act === 'pause') this.pause(); });
    el.classList.add('intro');
    this.d = App.myDragon(); this.d.place(this.hx(), 200);
    Scene.onDraw = ctx => this.d.draw(ctx);
    this.renderLine(false);
    this.tick(0);
  },
  hx() { return App.W / 2 - 250; },

  renderLine(aim = true) {
    const L = this.L, line = L.lines[L.li];
    const old = $('.line', this.prompt); if (old) old.remove();
    const div = document.createElement('div'); div.className = 'line';
    div.innerHTML = '<i class="caret"></i>' + [...line].map(ch => `<span class="ch${ch === ' ' ? ' sp' : ''}">${ch === ' ' ? '' : esc(ch)}</span>`).join('');
    this.prompt.insertBefore(div, this.nextEl);
    this.lineEl = div; this.tiles = $$('.ch', div); this.caret = $('.caret', div);
    this.tiles[0].classList.add('cur');
    const next = L.lines[L.li + 1];
    this.nextEl.innerHTML = next ? `<small>Next</small>${esc(next)}` : '<small>Last line</small>';
    if (aim) this.kb.target(line[0]);
  },

  start() {
    const b = $('.lv-banner', this.el); if (b) b.remove();
    this.el.classList.remove('intro');
    this.L.phase = 'play'; Sound.whoosh();
    this.kb.target(this.L.lines[0][0]);
  },

  key(e) {
    const L = this.L;
    if (L.phase === 'intro') { if (e.key === ' ' || e.key === 'Enter') this.start(); else if (e.key === 'Escape') this.pause(); return; }
    if (L.phase !== 'play') return;
    if (e.key === 'Escape') { this.pause(); return; }
    if (e.key.length !== 1) { if (e.key === 'Shift') this.kb.press(e); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const exp = L.lines[L.li][L.pos];
    this.capsWarn(e.getModifierState && e.getModifierState('CapsLock'));
    if (e.key === exp) { this.kb.press(e, true); this.hit(exp); }
    else if (e.key === ' ' && L.pos === 0 && L.li > 0) { /* a space after a line wrap is fine */ }
    else { this.kb.press(e, false); this.miss(e.key, exp); }
  },

  capsWarn(on) {
    let w = $('.caps-warn', this.el);
    if (on && !w) { w = document.createElement('div'); w.className = 'caps-warn'; w.textContent = 'Caps Lock is on. Press the Caps Lock key once to turn it off.'; this.el.appendChild(w); }
    else if (!on && w) w.remove();
  },

  hit(exp) {
    const L = this.L, now = performance.now();
    if (L.lastT) L.activeMs += Math.min(now - L.lastT, 4000); else L.activeMs += 400;
    L.lastT = now; L.idle = 0;
    const tile = this.tiles[L.pos];
    tile.classList.remove('cur', 'err'); tile.classList.add('done'); if (L.err) tile.classList.add('slip');
    if (!L.err) { L.first++; Store.noteKey(exp, true); }
    L.err = false; L.done++; L.streak++; L.best = Math.max(L.best, L.streak);
    L.kps += 1; this.d.vy -= 55;
    L.heat = Math.min(1, L.heat + 0.013 + (L.streak > 20 ? 0.005 : 0));
    Sound.key(L.note++, L.streak);
    const p = App.pos(tile, 0.5, 0.3);
    FX.burst(p.x, p.y, { n: 3, size: 4, speed: 130, ring: false, g: -200, colors: [`rgb(${Scene.ACCENT[Scene.theme]})`, '#ffffff'] });
    L.pos++;
    if (L.pos === this.wordEnds[L.li][L.wi]) this.wordDone();
    if (this.MILESTONES.includes(L.streak)) this.combo(L.streak);
    if (L.pos >= L.lines[L.li].length) {
      L.li++; L.pos = 0; L.wi = 0;
      if (L.li >= L.lines.length) { this.updateHud(); this.finish(); return; }
      this.renderLine();
    } else {
      this.tiles[L.pos].classList.add('cur');
      this.caret.style.transform = `translateX(${L.pos * this.CH}px)`;
      this.kb.target(L.lines[L.li][L.pos]);
    }
    this.updateHud();
  },

  miss(typed, exp) {
    const L = this.L;
    if (!L.err) { L.err = true; L.errors++; Store.noteKey(exp, false); }
    L.streak = 0; L.note = 0; L.heat *= 0.5;
    const tile = this.tiles[L.pos], caret = this.caret, line = this.lineEl;
    tile.classList.add('err'); caret.classList.add('bad');
    line.classList.remove('jolt'); void line.offsetWidth; line.classList.add('jolt');
    setTimeout(() => { tile.classList.remove('err'); caret.classList.remove('bad'); }, 280);
    Scene.hit(); this.d.zap = 1; this.d.vy += 240;
    Sound.miss();
    if (exp !== exp.toLowerCase() && typed === exp.toLowerCase()) App.toast('Hold Shift to make a capital letter');
    else if (exp === '?' && typed === '/') App.toast('Hold Shift and press / to make a question mark');
    this.updateHud();
  },

  wordDone() {
    const L = this.L, g = this.gemList[L.wordsDone], m = this.d.mouth();
    FX.burst(m.x + 10, m.y, { n: 12, speed: 280, size: 8, g: 0, colors: [`hsl(${g.hue},100%,75%)`, '#ffffff', `hsl(${g.hue},90%,60%)`], ringGrow: 170 });
    L.wordsDone++; L.gemsGot++; L.wi++; L.note = 0;
    Sound.gem();
    const chip = $('.chip.gems', this.el);
    chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump');
  },

  combo(n) {
    const m = this.d.mouth();
    FX.text(m.x + 130, Math.max(110, m.y - 70), `${n} in a row`, '#ffc23d', 34);
    Sound.milestone(); Sound.fire();
    this.d.jawTarget = 1;
    let k = 0;
    const iv = setInterval(() => {
      const q = this.d.mouth();
      FX.fire(q.x, q.y, q.dx, q.dy, 1.15);
      if (++k > 10 || App.screen !== 'level') { clearInterval(iv); this.d.jawTarget = 0; }
    }, 45);
  },

  updateHud() {
    const L = this.L, el = this.el;
    const attempted = L.done + (L.err ? 1 : 0);
    const acc = attempted ? Math.round(L.first / attempted * 100) : 100;
    $('.chip.acc span', el).textContent = acc + '%';
    $('.chip.streak span', el).textContent = L.streak;
    $('.chip.streak', el).classList.toggle('hot', L.streak >= 10);
    $('.chip.gems span', el).textContent = L.gemsGot;
    $('.lv-progress i', el).style.width = (L.done / L.total * 100) + '%';
  },

  tick(dt) {
    const L = this.L, d = this.d;
    this.t += dt;
    L.kps *= Math.exp(-dt);
    L.idle += dt;
    if (L.phase === 'play' && L.idle > 2.5) L.heat = Math.max(0, L.heat - dt * 0.06);

    const ends = this.wordEnds[L.li] || [1];
    const ws = L.wi ? ends[L.wi - 1] : 0, we = ends[L.wi] || 1;
    const frac = L.phase === 'play' ? clamp((L.pos - ws) / Math.max(1, we - ws), 0, 1) : 0;
    L.d += ((L.wordsDone + frac) * this.GAP - L.d) * (1 - Math.exp(-9 * dt));

    // flow drives the picture and the music together
    const done = L.phase === 'done';
    Scene.setSpeed(done ? 620 : 46 + Math.min(6, L.kps) * 115);
    Scene.setHeat(done ? 1 : L.heat);
    Sound.setEnergy(L.phase === 'intro' ? 0.1 : done ? (this.calm ? 0.15 : Math.max(0.6, L.heat)) : 0.16 + L.heat * 0.84);
    this.flowEl.style.width = (L.heat * 100) + '%';
    this.el.style.setProperty('--heat', L.heat.toFixed(2));

    // steer the dragon: it weaves from shard to shard, and loops then streaks away at the end
    const hx = this.hx(), nextGem = this.gemList[L.wordsDone], flow = clamp(Scene.speed * 0.95, 80, 720);
    let tx = hx + Math.min(46, L.kps * 9), ty = nextGem ? nextGem.y : 190;
    if (done) {
      this.doneT += dt;
      const u = this.doneT / 0.95;
      if (u < 1) { tx = hx + Math.sin(u * TAU) * 110; ty = this.loopY - 90 + Math.cos(u * TAU) * 90; }
      else { tx = hx + (u - 1) * 1700; ty = this.loopY - 30; }
    }
    d.boost = done ? 4 : L.kps;
    d.update(dt, tx, ty + Math.sin(this.t * 4.2) * 4, done ? 260 : flow, done ? 60 : 30, done ? 10 : 8);

    const h = d.head();
    Scene.gems.length = 0;
    for (let i = L.wordsDone; i < Math.min(this.gemList.length, L.wordsDone + 7); i++) {
      const g = this.gemList[i], x = hx + 56 + (g.D - L.d);
      if (x > App.W + 60) break;
      Scene.gems.push({ x, y: g.y, hue: g.hue, s: 1.1, a: done ? 0 : 1, phase: i });
    }
    if (h.y < 96) { h.y = 96; d.vy = Math.max(0, d.vy); }
  },

  pause() {
    const L = this.L;
    if (L.phase === 'done') return;
    L.lastT = 0; Sound.click();
    App.modal(`<div class="modal"><button class="btn icon x" data-act="resume" aria-label="Close">${ic('close')}</button><div class="kicker">Paused</div><h2>Take a breath</h2><p>Your dragon will hold position.</p>
      <div class="row"><button class="btn" data-act="map">${ic('map')} Map</button><button class="btn" data-act="again">${ic('retry')} Restart</button>
      <button class="btn primary" data-act="resume">${ic('play')} Resume</button></div></div>`,
    { act: a => { if (a === 'map') App.go('map', { world: this.level.world }); else if (a === 'again') App.go('level', { id: this.level.id }); else App.closeModal(); },
      key: e => { if (e.key === 'Enter' || e.key === ' ') App.closeModal(); } });
  },

  finish() {
    const L = this.L, S = Store.get(), level = this.level, id = level.id;
    L.phase = 'done'; this.kb.clear(); this.capsWarn(false);
    this.loopY = this.d.head().y; this.doneT = 0;
    Sound.whoosh();

    const acc = L.first / L.total, pct = Math.floor(acc * 100);
    const wpm = Math.max(1, Math.round((L.total / 5) / (Math.max(L.activeMs, 2000) / 60000)));
    const stars = pct >= 98 ? 3 : pct >= 95 ? 2 : pct >= 90 ? 1 : 0;
    const rec = S.levels[id] || (S.levels[id] = { stars: 0, bestAcc: 0, bestWpm: 0, plays: 0 });
    const firstClear = stars > 0 && rec.stars === 0, worldWasDone = Store.worldDone(level.world);
    const newBest = stars > 0 && rec.stars > 0 && pct > rec.bestAcc;
    rec.plays++; rec.stars = Math.max(rec.stars, stars); rec.bestAcc = Math.max(rec.bestAcc, pct);
    if (stars) rec.bestWpm = Math.max(rec.bestWpm, wpm);

    const notes = [];
    let coins = 3;
    if (stars) {
      coins = Math.round(L.gemsGot * 0.5) + stars * 5;
      if (firstClear) { coins += 10; notes.push('first clear'); }
    }
    const streakBonus = Store.touchStreak();
    if (streakBonus) { coins += streakBonus; notes.push(S.streak.count > 1 ? `${S.streak.count} day streak` : 'first flight today'); }
    Store.addCoins(coins);
    S.history.push({ t: Date.now(), id, acc: pct, wpm, secs: Math.round(L.activeMs / 1000), stars });
    if (S.history.length > 300) S.history.shift();
    S.totalSecs += Math.round(L.activeMs / 1000);

    const events = [];
    if (!worldWasDone && Store.worldDone(level.world)) {
      for (const w of Store.grantRewards()) events.push({ type: 'reward', world: w });
      if (level.world === 5) events.push({ type: 'champion' });
    }
    if (Store.stage() > S.seenStage) { events.push({ type: 'grow', before: S.seenStage }); S.seenStage = Store.stage(); }
    Store.save();
    App.later(() => this.results({ pct, wpm, stars, coins, notes, newBest, events }), 1500);
  },

  results(r) {
    const L = this.L, level = this.level, next = LEVELS[this.idx + 1], pass = r.stars > 0;
    const speed = SPEED_NAMES.filter(([n]) => r.wpm >= n).pop()[1];
    const title = r.stars === 3 ? 'Flawless' : r.stars === 2 ? 'Great flying' : r.stars === 1 ? 'Level cleared' : 'So close';
    const goNext = () => {
      const ev = r.events.shift();
      if (ev) { Celebrate[ev.type](ev, goNext); return; }
      if (!next) App.go('map', { world: 5 });
      else if (next.world !== level.world) App.go('map', { world: next.world });
      else App.go('level', { id: next.id });
    };
    const again = () => App.go('level', { id: level.id });
    const toMap = () => { const ev = r.events.shift(); if (ev) { Celebrate[ev.type](ev, toMap); return; } App.go('map', { world: level.world }); };
    const wrap = App.modal(`<div class="modal result"><div class="kicker">${esc(level.title)}</div><h2>${title}${r.newBest ? '<span class="badge-new">NEW BEST</span>' : ''}</h2>
      <div class="stars">${[0, 1, 2].map(i => `<div class="slot">${ic('starOff')}${i < r.stars ? ic('star', 'won') : ''}</div>`).join('')}</div>
      ${pass ? '' : `<p>You scored <b>${r.pct}%</b>. A star needs 90%.<br>Slow down and aim for the glowing key. You are close.</p>`}
      <div class="stats">
        <div class="stat ${r.pct >= 90 ? 'good' : ''}"><b>${r.pct}%</b><span>accuracy</span></div>
        <div class="stat"><b>${r.wpm}</b><span>words a minute<br>${speed}</span></div>
        <div class="stat"><b>${L.best}</b><span>best streak</span></div>
        <div class="stat"><b>${L.gemsGot}</b><span>shards caught</span></div>
      </div>
      <div class="earn">${ic('shard')} +<span class="earn-n">0</span>${r.notes.length ? `<small>${esc(r.notes.join(', '))}</small>` : ''}</div>
      <div class="row">
        <button class="btn" data-act="map">${ic('map')} Map</button>
        ${pass ? `<button class="btn" data-act="again">${ic('retry')} Again</button><button class="btn primary big" data-act="next">${next ? 'Next' : 'Finish'} ${ic('next')}</button>`
          : `<button class="btn primary big" data-act="again">${ic('retry')} Try again</button>`}
      </div></div>`,
    { act: a => { Sound.click(); if (a === 'next') goNext(); else if (a === 'again') again(); else toMap(); },
      key: e => { if (e.key === 'Enter') { Sound.click(); if (pass) goNext(); else again(); } } });

    if (pass) { Sound.fanfare(); FX.confetti(30 + r.stars * 34); } else { this.calm = true; Sound.almost(); }
    $$('.won', wrap).forEach((s, i) => App.later(() => {
      s.classList.add('in'); Sound.star(i);
      const p = App.pos(s); FX.burst(p.x, p.y, { n: 18, speed: 360, size: 9, colors: ['#ffd23f', '#ffffff', '#ff9a3d'] });
    }, 500 + i * 400));
    App.later(() => {
      const e = $('.earn-n', wrap); if (!e) return;
      App.countTo(e, 0, r.coins, 800);
      const p = App.pos($('.earn', wrap)); FX.burst(p.x, p.y, { n: 12, colors: ['#22e1ff', '#ffffff'], speed: 240 });
    }, 550 + r.stars * 400);
  },
});

/* Pop-ups for the big moments */
const Celebrate = {
  show(html, cb, act) {
    Sound.levelUp(); FX.confetti(110);
    FX.cannon(0, 720, -0.9, 34); FX.cannon(App.W, 720, -2.25, 34);
    App.modal(html, { act: (a) => { Sound.click(); if (act) act(a); cb(); }, key: e => { if (e.key === 'Enter' || e.key === ' ') cb(); } });
  },
  /* finishing a world wins a trail, a crest or a skin */
  reward(ev, cb) {
    const S = Store.get(), r = ev.world.reward, field = { skin: 'color', trail: 'trail', crest: 'crest' }[r.kind];
    const it = ({ skin: DRAGON_COLORS, trail: TRAILS, crest: CRESTS })[r.kind][r.id];
    const look = { zoom: [1.5, 1.3, 1.1, 0.95][Store.stage()] }; look[field] = r.id;
    this.show(`<div class="modal unlock"><div class="kicker">${ev.world.name} complete</div><h2>New ${r.kind}: ${it.name}</h2>
      ${App.dv(look)}
      <div class="row"><button class="btn" data-act="later">Keep my look</button><button class="btn primary" data-act="equip">Equip it</button></div></div>`, cb,
    a => { if (a === 'equip') { S.pet[field] = r.id; Store.save(); Sound.equip(); } });
  },
  grow(ev, cb) {
    const S = Store.get(), st = Store.stage();
    this.show(`<div class="modal unlock"><div class="kicker">${STAGE_NAMES[ev.before]} to ${STAGE_NAMES[st]}</div><h2>${esc(S.pet.name)} grew</h2>
      <div class="grow">${App.dv({ stage: ev.before, zoom: 1 })}${ic('next')}${App.dv({ stage: st, zoom: 1 })}</div>
      <p>Every star you earn makes your dragon stronger.</p>
      <div class="row"><button class="btn primary" data-act="ok">Continue</button></div></div>`, cb);
  },
  champion(ev, cb) {
    const S = Store.get();
    this.show(`<div class="modal unlock"><div class="kicker">Every world complete</div><h2>${esc(S.kid)}, typing champion</h2>
      ${App.dv({ color: 'gold', crest: 'halo', trail: 'prism', zoom: 0.95 })}
      <p>You can touch type. Go back for three stars on every level, or chase a high score in Gem Storm.</p>
      <div class="row"><button class="btn primary" data-act="ok">Continue</button></div></div>`, cb);
  },
};

/* ---- mini.js ---- */
/* Dragon Keys - Gem Storm: words fall from the sky, type them before they land */
'use strict';

App.register('mini', {
  enter(el) {
    Scene.setTheme('summit'); Scene.setHorizon(0); Scene.setSpeed(18);
    Sound.music('summit'); Sound.setEnergy(0.25);
    const S = Store.get();
    this.words = Content.miniWords(Store.highestIndex());
    this.state = 'ready'; this.t = 0;
    el.innerHTML = `<div class="lv-top" style="top:0">
        <button class="btn icon" data-act="back" aria-label="Back">${ic('back')}</button>
        <div class="hud-title">Gem Storm<small>Best ${S.mini.best}</small></div>
        <div style="flex:1"></div>
        <div class="chip score"><small>score</small><span>0</span></div>
        <div class="chip lives"></div>
        ${App.sysButtons()}
      </div>
      <div class="mini-area"></div><div class="mini-line"></div>
      <div class="mini-hint panel">Words are falling. Type one to blast it before it reaches the red line.
        <div class="go">Press <span class="keycap">SPACE</span> to start</div></div>`;
    this.area = $('.mini-area', el);
    el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && b.dataset.act === 'back') { Sound.click(); App.go('den'); } });
    this.d = App.myDragon(); this.d.place(App.W / 2, 640);
    Scene.onDraw = ctx => this.d.draw(ctx);
    this.reset();
  },
  reset() {
    this.drops = []; this.aim = null; this.score = 0; this.lives = 3; this.time = 0; this.spawnIn = 0.4; this.zapped = 0; this.combo = 0;
    this.area.innerHTML = '';
    this.hud();
  },
  hud() {
    $('.chip.score span', this.el).textContent = this.score;
    $('.chip.lives', this.el).innerHTML = [0, 1, 2].map(i => `<span style="opacity:${i < this.lives ? 1 : 0.2}">${ic('flame')}</span>`).join('');
  },
  begin() {
    const h = $('.mini-hint', this.el); if (h) h.remove();
    this.reset(); this.state = 'play'; Sound.whoosh();
  },
  spawn() {
    const W = App.W, laneW = 230, lanes = Math.floor((W - 120) / laneW);
    const used = new Set(this.drops.filter(d => d.y < 150).map(d => d.lane));
    const free = [...Array(lanes).keys()].filter(i => !used.has(i));
    if (!free.length) return;
    const lane = Content.pick(free);
    const maxLen = this.time < 20 ? 4 : this.time < 45 ? 5 : 7;
    const firsts = new Set(this.drops.map(d => d.word[0]));
    let pool = this.words.filter(w => w.length <= maxLen && !firsts.has(w[0]));
    if (!pool.length) pool = this.words.filter(w => w.length <= maxLen);
    const word = Content.pick(pool);
    const el = document.createElement('div');
    el.className = 'drop';
    el.innerHTML = `${ic('shard')}<span><i></i><b>${esc(word)}</b></span>`;
    this.area.appendChild(el);
    const x = 60 + lane * laneW + Math.random() * 60;
    this.drops.push({ word, typed: 0, x, y: 74, lane, el, v: 30 + Math.min(60, this.time * 0.5) + Math.random() * 12 });
  },
  tick(dt) {
    this.t += dt;
    // the dragon hovers below and turns toward the word being typed
    const W = App.W, aimX = this.aim ? this.aim.x + 60 : W / 2;
    this.d.boost = 1;
    this.d.update(dt, W / 2 + (aimX - W / 2) * 0.3 + Math.sin(this.t * 0.8) * 20, 632 + Math.sin(this.t * 1.6) * 10, 90, 22, 7);
    if (this.state !== 'play') return;
    this.time += dt; this.spawnIn -= dt;
    Sound.setEnergy(clamp(0.3 + this.time / 90 + this.combo * 0.03, 0, 1));
    Scene.setHeat(clamp(this.combo / 12, 0, 1));
    if (this.spawnIn <= 0 && this.drops.length < 6) { this.spawn(); this.spawnIn = Math.max(0.95, 2.5 - this.time * 0.022); }
    for (const d of this.drops.slice()) {
      if (d.dead || this.state !== 'play') continue;
      d.y += d.v * dt;
      d.el.style.transform = `translate(${d.x}px, ${d.y}px)`;
      if (d.y > 720 - 138 - 46) this.land(d);
    }
  },
  land(d) {
    const p = App.pos(d.el);
    FX.burst(p.x, p.y, { n: 14, colors: ['#ff4d6d', '#ffffff', '#ff9a3d'], speed: 240 });
    this.remove(d);
    this.lives--; this.combo = 0; Sound.miss(); Scene.hit(); this.hud();
    if (this.lives <= 0) this.over();
  },
  remove(d) {
    d.dead = true; d.el.remove();
    this.drops = this.drops.filter(x => x !== d);
    if (this.aim === d) this.aim = null;
  },
  key(e) {
    if (this.state === 'ready') { if (e.key === ' ' || e.key === 'Enter') this.begin(); else if (e.key === 'Escape') App.go('den'); return; }
    if (e.key === 'Escape') { App.go('den'); return; }
    if (this.state !== 'play' || e.key.length !== 1) return;
    const k = e.key.toLowerCase();
    if (!this.aim) {
      const hits = this.drops.filter(d => d.word[0] === k).sort((a, b) => b.y - a.y);
      if (!hits.length) { Sound.nope(); return; }
      this.aim = hits[0]; this.aim.el.classList.add('aim');
    }
    const d = this.aim;
    if (d.word[d.typed] !== k) {
      Sound.nope(); d.el.classList.remove('bad'); void d.el.offsetWidth; d.el.classList.add('bad');
      return;
    }
    d.typed++; Sound.key(d.typed, this.combo * 4);
    $('i', d.el).textContent = d.word.slice(0, d.typed); $('b', d.el).textContent = d.word.slice(d.typed);
    if (d.typed >= d.word.length) this.zap(d);
  },
  zap(d) {
    const from = this.d.mouth(), to = App.pos(d.el);
    d.dead = true; this.aim = null; this.combo++;
    const pts = d.word.length * 10;
    this.score += pts; this.zapped++;
    this.d.jawTarget = 1; Sound.fire();
    setTimeout(() => { this.d.jawTarget = 0; }, 260);
    FX.shoot(from, to, () => {
      FX.burst(to.x, to.y, { n: 20, speed: 360, size: 9, colors: ['#22e1ff', '#ffffff', '#ffd23f', '#ff3df0'] });
      FX.text(to.x, to.y - 20, '+' + pts, '#ffc23d', 26);
      Sound.gem();
      d.el.remove(); this.drops = this.drops.filter(x => x !== d);
    });
    this.hud();
  },
  over() {
    const S = Store.get();
    this.state = 'over';
    this.drops.forEach(d => d.el.remove()); this.drops = [];
    const coins = Math.min(30, Math.floor(this.score / 40));
    const best = this.score > S.mini.best;
    if (best) S.mini.best = this.score;
    S.mini.plays++; Store.addCoins(coins); Store.save();
    Sound.setEnergy(0.3); Scene.setHeat(0);
    if (best && this.score > 0) { Sound.fanfare(); FX.confetti(80); } else Sound.almost();
    App.modal(`<div class="modal"><div class="kicker">Gem Storm</div><h2>${best && this.score > 0 ? 'New best score' : 'Storm over'}</h2>
      <p>You blasted ${this.zapped} ${this.zapped === 1 ? 'word' : 'words'}.</p>
      <div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat good"><b>${this.score}</b><span>score</span></div><div class="stat"><b>${S.mini.best}</b><span>best</span></div></div>
      <div class="earn">${ic('shard')} +${coins}</div>
      <div class="row"><button class="btn" data-act="den">${ic('home')} Lair</button><button class="btn primary big" data-act="again">${ic('retry')} Again</button></div></div>`,
    { act: a => { Sound.click(); if (a === 'den') App.go('den'); else { App.closeModal(); $('.hud-title small', this.el).textContent = 'Best ' + S.mini.best; this.begin(); } },
      key: e => { if (e.key === 'Enter') { App.closeModal(); this.begin(); } } });
  },
});

/* ---- parent.js ---- */
/* Dragon Keys - the page for grown-ups: progress, trouble keys and settings */
'use strict';

App.register('parent', {
  noScene: true,
  enter(el) {
    Sound.music('home'); Sound.setEnergy(0.2);
    el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) this.act(b.dataset.act, b); });
    el.addEventListener('change', e => this.change(e.target));
    this.render();
  },
  fmtTime(secs) {
    const m = Math.round(secs / 60);
    return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
  },
  chart(hist) {
    if (hist.length < 2) return '<p>The chart appears after two finished levels.</p>';
    const W = 520, H = 190, pad = 34, n = hist.length;
    const maxW = Math.max(20, ...hist.map(h => h.wpm));
    const x = i => pad + i * (W - pad - 10) / (n - 1);
    const ya = v => H - 24 - (clamp(v, 60, 100) - 60) / 40 * (H - 44), yw = v => H - 24 - v / maxW * (H - 44);
    const line = (fn, key) => hist.map((h, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + fn(h[key]).toFixed(1)).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">
      <path d="M${pad} ${ya(90)}H${W - 10}" stroke="rgba(125,255,176,.4)" stroke-width="1.5" stroke-dasharray="6 6"/>
      <text x="0" y="${ya(100) + 4}">100%</text><text x="4" y="${ya(90) + 4}">90%</text><text x="4" y="${ya(60) + 4}">60%</text>
      <path d="${line(yw, 'wpm')}" fill="none" stroke="#22e1ff" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="${line(ya, 'acc')}" fill="none" stroke="#7dffb0" stroke-width="2.5" stroke-linejoin="round"/>
      ${hist.map((h, i) => `<circle cx="${x(i)}" cy="${ya(h.acc)}" r="3" fill="#7dffb0"/>`).join('')}
      <text x="${pad}" y="${H - 4}">oldest</text><text x="${W - 10}" y="${H - 4}" text-anchor="end">latest</text></svg>
      <div class="legend"><span><i style="background:#7dffb0"></i>Accuracy</span><span><i style="background:#22e1ff"></i>Speed (up to ${maxW} words a minute)</span><span>Dashed line: 90% pass mark</span></div>`;
  },
  render() {
    const S = Store.get(), el = this.el;
    const passed = LEVELS.filter(l => Store.levelStars(l.id) > 0).length;
    const hist = S.history.slice(-30), last10 = S.history.slice(-10);
    const avgAcc = last10.length ? Math.round(last10.reduce((t, h) => t + h.acc, 0) / last10.length) : 0;
    const bestWpm = S.history.reduce((m, h) => h.stars ? Math.max(m, h.wpm) : m, 0);
    const rate = k => { const r = S.keys[k]; return r && r.hit + r.miss >= 8 ? r.miss / (r.hit + r.miss) : null; };
    const heat = ['qwertyuiop', "asdfghjkl;'", 'zxcvbnm,./'].map(row => `<div>${[...row].map(k => {
      const r = rate(k);
      const bg = r == null ? '' : r < 0.05 ? 'background:#1f6b4a;color:#c9ffe0' : r < 0.12 ? 'background:#7a6a1a;color:#fff3b0' : r < 0.25 ? 'background:#9a5216;color:#ffe0c0' : 'background:#b3263f;color:#ffe0e6';
      return `<span style="${bg}" title="${r == null ? 'Not enough practice yet' : Math.round(r * 100) + '% missed'}">${esc(k)}</span>`;
    }).join('')}</div>`).join('');
    const trouble = Object.keys(S.keys).map(k => [k, rate(k)]).filter(([, r]) => r != null && r >= 0.08).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const rows = LEVELS.map(l => {
      const r = S.levels[l.id];
      return `<tr><td>${l.id}</td><td>${esc(l.title)}</td><td>${r && r.stars ? ic('star').repeat(r.stars) : r && r.plays ? 'not passed yet' : ''}</td>
        <td>${r && r.plays ? r.bestAcc + '%' : ''}</td><td>${r && r.bestWpm ? r.bestWpm : ''}</td><td>${r ? r.plays : ''}</td></tr>`;
    }).join('');
    el.innerHTML = `<div class="parent">
      <header><button class="btn icon" data-act="back" aria-label="Back">${ic('back')}</button>
        <div><h1>Stats</h1><p>${esc(S.kid)}'s progress with ${esc(S.pet.name)}. For grown-ups too. Everything is saved in this browser only.</p></div></header>
      <div class="cards">
        <div class="card"><b>${passed} / ${LEVELS.length}</b><span>levels passed</span></div>
        <div class="card"><b>${Store.totalStars()} / ${LEVELS.length * 3}</b><span>stars</span></div>
        <div class="card"><b>${this.fmtTime(S.totalSecs)}</b><span>time typing</span></div>
        <div class="card"><b>${S.streak.count}</b><span>days in a row</span></div>
        <div class="card"><b>${avgAcc ? avgAcc + '%' : '-'}</b><span>accuracy, last 10</span></div>
        <div class="card"><b>${bestWpm || '-'}</b><span>best words a minute</span></div>
      </div>
      <div class="two">
        <div><h2>Last ${hist.length || ''} levels</h2><div class="box">${this.chart(hist)}</div></div>
        <div><h2>Trouble keys</h2><div class="box"><div class="heat">${heat}</div>
          <div class="legend"><span><i style="background:#1f6b4a"></i>solid</span><span><i style="background:#7a6a1a"></i>some slips</span><span><i style="background:#9a5216"></i>often missed</span><span><i style="background:#b3263f"></i>needs work</span></div>
          <p>${trouble.length ? 'Most missed: ' + trouble.map(([k, r]) => `<b>${esc(k.toUpperCase())}</b> (${Math.round(r * 100)}%)`).join(', ') + '. Levels quietly add extra words with these keys.' : 'No trouble keys so far. Grey keys have not had enough practice to judge.'}</p></div></div>
      </div>
      <div class="two">
        <div><h2>How to help</h2><div class="box"><ul>
          <li>Ten minutes a day works better than an hour once a week.</li>
          <li>Stars come from accuracy, not speed. Speed follows once the fingers know where to go.</li>
          <li>Eyes stay on the screen. The glowing key and the coloured fingers show which finger to use.</li>
          <li>The music follows the typing. A clean streak adds layers, and a wrong key drops them.</li>
          <li>A level needs 90% accuracy to pass. Three stars need 98%, so replaying levels is worth it.</li>
          <li>A typical goal for a ten-year-old is 20 to 25 words a minute at 90% accuracy or better.</li></ul></div></div>
        <div><h2>Settings</h2><div class="box"><div class="settings">
          <label><input type="checkbox" data-set="music" ${S.settings.music ? 'checked' : ''}> Music</label>
          <label><input type="checkbox" data-set="sound" ${S.settings.sound ? 'checked' : ''}> Sound effects</label>
          <label><input type="checkbox" data-set="unlockAll" ${S.settings.unlockAll ? 'checked' : ''}> Unlock every level</label>
          <label>Child <input class="text" data-set="kid" maxlength="10" value="${esc(S.kid)}"></label>
          <label>Dragon <input class="text" data-set="pet" maxlength="10" value="${esc(S.pet.name)}"></label>
          <button class="btn small" data-act="reset">Erase all progress</button>
        </div>${Store.isMemoryOnly() ? '<p style="color:#ff8f9c"><b>This browser is blocking saved data, so progress will be lost when the page closes.</b> Try a normal (not private) window.</p>' : ''}</div></div>
      </div>
      <h2>Every level</h2>
      <div class="box"><table><tr><th>Level</th><th>Teaches</th><th>Stars</th><th>Best accuracy</th><th>Best speed</th><th>Plays</th></tr>${rows}</table></div>
    </div>`;
  },
  change(t) {
    const S = Store.get(), k = t.dataset.set;
    if (!k) return;
    if (k === 'sound') { S.settings.sound = t.checked; Sound.setOn(t.checked); }
    else if (k === 'music') { S.settings.music = t.checked; Sound.setMusic(t.checked); }
    else if (k === 'unlockAll') S.settings.unlockAll = t.checked;
    else if (k === 'kid') { S.kid = cleanName(t.value, S.kid); t.value = S.kid; }
    else if (k === 'pet') { S.pet.name = cleanName(t.value, S.pet.name); t.value = S.pet.name; }
    Store.save();
  },
  act(a) {
    if (a === 'back') { Sound.click(); App.go('den'); }
    else if (a === 'reset') {
      App.modal(`<div class="modal"><h2>Erase everything?</h2><p>This removes all stars, shards, unlocked looks and the dragon. It cannot be undone.</p>
        <div class="row"><button class="btn primary" data-act="no">Keep it</button><button class="btn" data-act="yes">Erase</button></div></div>`,
      { dismiss: true, act: x => { if (x === 'yes') { Store.reset(); App.go('title'); } else App.closeModal(); } });
    }
  },
  key(e) { if (e.key === 'Escape') this.act('back'); },
});

window.addEventListener('DOMContentLoaded', () => App.start());

</script>
